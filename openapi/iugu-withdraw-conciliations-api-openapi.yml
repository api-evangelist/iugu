openapi: 3.2.0
info:
  title: relatórios-para-conciliação Withdraw Conciliations API
  version: '1.0'
servers:
- url: https://api.iugu.com/v1
security:
- sec0: []
tags:
- name: Withdraw Conciliations
paths:
  /withdraw_conciliations:
    get:
      summary: Conciliação de Saques
      description: Retorna todos os pedidos de saques criados em ambiente de produção (`LIVE`) que tenham um determinado `status` e tenham sido atualizados em determinado período (entre `from`e `to`). No caso de marketplaces ou parceiros de negócios, retorna também os pedidos de saques de subcontas que atendam a esses critérios.
      operationId: conciliacao-de-saques
      parameters:
      - name: status
        in: query
        description: 'Status dos saques. Por padrão, todos os tipos de saques são considerados: `pending`, `processing`, `accepted` ou `rejected`.'
        schema:
          type: string
      - name: from
        in: query
        description: 'Data e hora **a partir** das quais os saques foram atualizados (`updated_at`). Por padrão: 1 dia atrás. Formato: `2018-05-01T14:30:00-03:00`.'
        schema:
          type: string
          format: date-time
      - name: to
        in: query
        description: 'Data e hora **até** as quais os saques foram atualizadas (`updated_at`). Por padrão: data e hora presentes. Formato: `2018-05-01T14:30:00-03:00`.'
        schema:
          type: string
          format: date-time
      - name: start
        in: query
        description: Usado para paginação. Define o número de registros que serão "pulados" na busca pelos saques.
        schema:
          type: integer
          format: int32
          default: 0
      - name: limit
        in: query
        description: Usado para paginação. Define o número máximo de registros retornados pelo endpoint.
        schema:
          type: integer
          format: int32
          default: 100
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n\"total_items\": 109,\n   \"withdraw_requests\": [\n       {\n          \"id\": \"2222222222222222222222222\",\n          \"created_at\": \"2024-08-15T10:40:51-03:00\",\n          \"updated_at\": \"2024-08-15T10:40:51-03:00\",\n          \"amount\": \"4500.0\",\n          \"status\": \"pending\",\n          \"feedback\": null,\n          \"account_id\": \"1111111111111111111\",\n          \"custom_variables\": [\n               {\n                  \"name\": \"EmpresaiuguRequestId\",\n                  \"value\": \"222dff87-1b31-4a19-af78-654e81995c20\"\n               }\n          ]\n       }\n}"
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value: '{}'
              schema:
                type: object
                properties: {}
      deprecated: false
      tags:
      - Withdraw Conciliations
components:
  securitySchemes:
    sec0:
      type: apiKey
      in: query
      name: api_token
