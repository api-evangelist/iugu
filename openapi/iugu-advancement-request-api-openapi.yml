          application/json:
            schema:
              type: object
              required:
              - requested_advancement_cents
              properties:
                requested_advancement_cents:
                  type: integer
                  description: Valor à ser simulado para a antecipação (em centavos)
                  format: int32
      responses:
        '202':
          description: '202'
          content:
            application/json:
              examples:
                Result:
                  value: Esta endpoint retorna apenas uma confirmação de que o pedido de simulação foi aceito. Para verificar o status da Simulação, utilize a endpoint "Verificar Status da Simulação" ou seja notificado via Webhook.
        '404':
          description: '404'
