        in: header
        description: Assinatura digital validada
        required: true
        schema:
          type: string
          default: signature=
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - transfer_type
              - amount_cents
              properties:
                scheduled_date:
                  type: string
                  description: Data para **agendar** o PIX (AAAA-MM-DD)
                  format: date
                transfer_type:
                  type: string
                  description: Tipo de transferência, "ted", "pix" ou "institucional".
                amount_cents:
                  type: integer
                  description: Valor em centavos. Valor mínimo 2 centavos
                  format: int32
                description:
                  type: string
                  description: Descrição da transferência que irá aparecer no comprovante
                check_payer:
                  type: string
                  description: Insira o documento (CPF ou CNPJ) do destinatário para validar se é o mesmo identificado através da chave PIX utilizada na transferência. Caso o documento enviado neste parâmetro seja diferente do cadastrado na chave PIX, a chamada retornará um erro. Agora é aceito o campo alfanumérico apenas para CNPJ.
                qrcode_type:
                  type: string
                  description: Tipo do QR Code
                end_to_end_id:
                  type: string
                  description: ID único do BACEN para rastreamento da transação Pix
                conciliation_id:
                  type: string
                  description: ID opcional para rastreamento interno da transação. <br> **Limite de 35 caracteres/Não aceita caractere especial.**
                external_reference:
                  type: string
                  description: Referência ou identificador externo da transferência. Não aparece no comprovante, apenas no retorno da requisição e no painel Alia.
                receiver:
                  type: object
                  description: Dados do destinatário da transferência. Utilize "name" limitação de 140 caracteres e "cpf_cnpj" quando a transferência for TED ou PIX para conta bancária.
                  properties:
                    name:
                      type: string
                      description: Nome do recebedor da transferência. Obrigatório se a transferência for TED ou PIX para conta bancária.
                    cpf_cnpj:
                      type: string
                      description: CPF ou CNPJ do recebedor da transferência. Obrigatório se a transferência for TED ou PIX para conta bancária ou transfer_type = institucional.<br>Agora é aceito o campo alfanumérico apenas para CNPJ.
                    bank:
                      type: object
                      description: Dados bancários do destinatário da transferência
                      properties:
                        ispb:
                          type: string
                          description: 'Número ''ispb'', Identificador de Sistema de Pagamentos Brasileiro do banco que receberá a transferência. Ex: 60701190 caso seja Itaú. Campo obrigatório caso a transferência seja TED ou PIX para conta bancária ou transfer_type = institucional'
                        branch:
                          type: string
                          description: Agência. Não precisa informar dígito. Obrigatório se transfer_type = institucional. Opcional se tipo da conta seja conta de pagamento.
                        account:
                          type: string
                          description: Número da conta + dígito da conta (se houver). Não é necessário traço para separar o dígito. Campo obrigatório caso a transferência seja TED ou PIX para conta bancária.
                        account_type:
                          type: string
                          description: 'Tipo de Conta: checking_account (Conta Corrente), salary_account (Conta Salário), savings_account (Poupança), payment_account (Conta de Pagamento). Campo obrigatório caso a transferência seja TED ou PIX para conta corrente.'
                        bank_branch_digit:
                          type: string
                          description: Caso sua agência possua um 5° digito, é necessário informar nesse parâmetro.
                    pix:
                      type: object
                      description: Dados PIX do destinatário da transferência
