      description: Realize uma transferência para terceiros via TED ou PIX
      operationId: baas-pix-ted-out
      parameters:
      - name: Request-Time
        in: header
        description: Timestamp do momento que enviar a requisição de assinatura digital (RSA)
        required: true
        schema:
          type: string
          format: date-time
