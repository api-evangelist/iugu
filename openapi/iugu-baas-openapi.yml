              schema:
                type: object
                properties:
                  sent:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          example: 1234565F6F06412345ED425581234567
                        created_at:
                          type: string
                          example: '2013-11-19T11:24:29-02:00'
                        amount_cents:
                          type: string
                          example: '1000'
                        amount_localized:
                          type: string
                          example: R$ 10,00
                        receiver:
                          type: object
                          properties:
                            id:
                              type: string
                              example: 77C2565F6F064A26ABED4255894224F0
                            name:
                              type: string
                              example: Nome da Conta
                  received:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          example: 1234565F6F06132345ED425581234567
                        created_at:
                          type: string
                          example: '2013-12-19T11:24:29-02:00'
                        amount_cents:
                          type: string
                          example: '2000'
                        amount_localized:
                          type: string
                          example: R$ 20,00
                        sender:
                          type: object
                          properties:
                            id:
                              type: string
                              example: 77C2565F6F0611111BED4255894224F0
                            name:
                              type: string
                              example: Conta Teste
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value: '{}'
              schema:
                type: object
                properties: {}
      deprecated: false
