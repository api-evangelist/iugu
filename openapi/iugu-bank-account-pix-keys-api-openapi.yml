tags:
- name: Bank Account Pix Keys
paths:
  /bank_account_pix_keys:
    get:
      summary: Listar chaves Pix na Conta iugu
      description: Lista todas as chaves PIX atreladas a conta, ativas, processando e aguardando um pedido de custodia solicitado ou enviado ou aguardando resolução.
      operationId: baas-listar-chaves-pix
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Sucesso:
                  value: "{\n \"pix_keys\": [\n {\n \"id\": \"923B72F0DD2F42FD94CEA3E771C8363B\",\n \"pix_key\": \"email@iugu.com\",\n \"pix_key_type\": \"email\",\n \"created_at\": \"2024-01-15T12:40:15-03:00\",\n \"status\": \"active\"\n }\n ]\n}"
              schema:
                type: object
                properties:
                  pix_keys:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          example: 923B72F0DD2F42FD94CEA3E771C8363B
                        pix_key:
                          type: string
                          example: email@iugu.com
                        pix_key_type:
                          type: string
                          example: email
                        created_at:
                          type: string
                          example: '2024-01-15T12:40:15-03:00'
                        status:
                          type: string
                          example: active
        '401':
          description: '401'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n  \"errors\": \"Apenas disponível para o ambiente produção\"\n}"
              schema:
                type: object
                properties:
                  errors:
                    type: string
                    example: Apenas disponível para o ambiente produção
      x-readme:
        code-samples:
        - language: curl
          code: 'curl --location --request GET

            ''https://api.iugu.com/v1/transfer_requests/{ID}'' \

            --header ''Accept: application/json'' \

            --header ''Content-Type: application/json'' \

            --header ''Request-Time: 2022-06-08T15:35:06-03:00'' \

            --header ''Authorization: Basic {{api_token in base64}}'' \

            --header ''Cookie: __cfruid={{cookie}}'''
        samples-languages:
        - curl
      tags:
      - Bank Account Pix Keys
