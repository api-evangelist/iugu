openapi: 3.2.0
info:
  title: tokens-e-cobrança-direta Charge Two Credit Cards API
  version: '1.0'
servers:
- url: https://api.iugu.com/v1
security:
- sec0: []
tags:
- name: Charge Two Credit Cards
paths:
  /charge_two_credit_cards:
    post:
      summary: Cobrança Direta com 2 Cartões
      description: Cobre **faturas avulsas** em 2 cartões diferentes. Saiba mais sobre Tokenização.
      operationId: cobranca-direta-com-2-cartoes
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - api_token
              properties:
                api_token:
                  type: string
                  description: '`api_token` da Conta que efetuará a cobrança'
                invoice_id:
                  type: string
                  description: ID da invoice
                iugu_credit_card_payment:
                  type: array
                  description: '**Limite de 2 objetos**'
                  items:
                    properties:
                      token:
                        type: string
                        description: Token do Cartão
                      amount:
                        type: integer
                        description: Quantia a ser cobrada neste cartão (em cents)
                        format: int32
                    type: object
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n    \"invoice\": {\n        \"status\": \"paid\"\n    },\n    \"credit_card_transactions\": [\n        {\n            \"reversible\": true,\n            \"last4\": \"5076\",\n            \"bin\": 516292,\n            \"brand\": \"Master\",\n            \"token\": \"token\",\n            \"message\": \"Transacao capturada com sucesso\",\n            \"success\": true,\n            \"issuer\": \"BANCO X\",\n            \"invoice_id\": \"BD9B9AE34DD44B08A75AB245CEA9B78D\",\n            \"LR\": \"00\"\n        },\n        {\n            \"reversible\": true,\n            \"last4\": \"1111\",\n            \"bin\": 549354,\n            \"brand\": \"Master\",\n            \"token\": \"token\",\n            \"message\": \"Transacao capturada com sucesso\",\n            \"success\": true,\n            \"issuer\": \"BANCO Y\",\n            \"invoice_id\": \"BD9B9AE34DD44B08A75AB245CEA9B78D\",\n            \"LR\": \"00\"\n        }\n    ]\n}"
              schema:
                type: object
                properties:
                  invoice:
                    type: object
                    properties:
                      status:
                        type: string
                        example: paid
                  credit_card_transactions:
                    type: array
                    items:
                      type: object
                      properties:
                        reversible:
                          type: boolean
                          example: true
                          default: true
                        last4:
                          type: string
                          example: '5076'
                        bin:
                          type: integer
                          example: 516292
                          default: 0
                        brand:
                          type: string
                          example: Master
                        token:
                          type: string
                          example: token
                        message:
                          type: string
                          example: Transacao capturada com sucesso
                        success:
                          type: boolean
                          example: true
                          default: true
                        issuer:
                          type: string
                          example: BANCO X
                        invoice_id:
                          type: string
                          example: BD9B9AE34DD44B08A75AB245CEA9B78D
                        LR:
                          type: string
                          example: '00'
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value: '{}'
              schema:
                type: object
                properties: {}
      deprecated: false
      security: []
      tags:
      - Charge Two Credit Cards
components:
  securitySchemes:
    sec0:
      type: apiKey
      in: query
      name: api_token
