                    : 0,\n            \"pending_count\": 0,\n            \"done_amount_cents\": 0,\n            \"done_client_share_cents\": 0,\n            \"done_fee_cents\": 0,\n            \"done_split_cents\": 0,\n            \"done_advance_fee_cents\": 0,\n            \"done_count\": 0,\n            \"canceled_amount_cents\": 200,\n            \"canceled_client_share_cents\": 96,\n            \"canceled_fee_cents\": 44,\n            \"canceled_split_cents\": 60,\n            \"canceled_advance_fee_cents\": 0,\n            \"canceled_count\": 1,\n            \"booked_amount_cents\": 0,\n            \"booked_client_share_cents\": 0,\n            \"booked_fee_cents\": 0,\n            \"booked_split_cents\": 0,\n            \"booked_advance_fee_cents\": 0,\n            \"booked_count\": 0,\n            \"total_amount_cents\": 200,\n            \"total_client_share_cents\": 96,\n            \"total_fee_cents\": 44,\n            \"total_split_cents\": 60,\n            \"total_advance_fee_cents\"\
                    : 0,\n            \"total_entries_count\": 1,\n            \"transaction_code\": \"VCC\",\n            \"advance_fee_today\": \"-0.0298\",\n            \"advance_fee_amount_cents_today\": null,\n            \"agreement_effects_count\": 4,\n            \"done_advance_count\": 0,\n            \"done_advance_amount_cents\": 0,\n            \"amount_availableble_for_advance_today_cents\": null,\n            \"agreement_effects_amount_cents\": null,\n            \"chargeback_pending_amount_cents\": 0,\n            \"chargeback_pending_count\": 0,\n            \"chargeback_contested_amount_cents\": 0,\n            \"chargeback_contested_count\": 0,\n            \"chargeback_lost_amount_cents\": 0,\n            \"chargeback_lost_count\": 0,\n            \"chargeback_won_amount_cents\": 0,\n            \"chargeback_won_count\": 0\n        }\n    ]\n}"
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value: '{}'
              schema:
                type: object
                properties: {}
      deprecated: false
  /accounts/consolidated_statements:
    get:
      summary: Extrato Consolidado
      description: "Extrato consolidado de uma conta agrupado por tipo de movimento.\n\n<div class=\"magic-block-callout type-warning\">\n<h3><i title=\"Warning\" class=\"fa fa-exclamation-circle\"></i>Atenção</h3>\n<div class=\"callout-body\">\n<p>\nEsta API obriga a utilização do <code>live_api_token</code> na autenticação da chamada. Somente em modo \"produção\" há movimentação de saldo na conta iugu.\n</p>\n</div>\n</div>\n\n<b>Tipos de movimento</b>\n<ul>\n  <li>transfer_ted: TED</li>\n  <li>transfer_pix: Transferência Pix</li>\n  <li>transfer_ted_revenue: Tarifa de TED</li>\n  <li>transfer_pix_revenue: Tarifa de Transferência Pix</li>\n  <li>invoice_return: Liquidação de Cartão</li>\n  <li>invoice_return_revenue: Tarifa de Liquidação de Cartão</li>\n  <li>invoice_return_advanced: Antecipação de Recebíveis</li>\n  <li>invoice_return_advanced_revenue: Tarifa de Liquidação Antecipada</li>\n  <li>refund: Estorno de Cartão</li>\n  <li>pix_refund: Estorno de Pix</li>\n  <li>pix_refund_revert:\
        \ Reversão Estorno Pix</li>\n  <li>pix: Liquidação de Pix</li>\n  <li>pix_revenue: Tarifa de Liquidação de Pix</li>\n  <li>bank_slip: Liquidação de Boleto</li>\n  <li>bank_slip_return: Liquidação de Boleto Final de Semana</li>\n  <li>bank_slip_revenue: Tarifa de Liquidação de Boleto</li>\n  <li>account_transfer: Transferência entre Contas</li>\n  <li>billing: Cobrança iugu</li>\n  <li>withdraw: Saque</li>\n  <li>start_balance: Saldo Inicial</li>\n  <li>end_balance: Saldo Final</li>\n  <li>chargeback: Chargeback</li>\n  <li>receivable_unit_settlement: Liquidação Residual de Recebíveis</li>\n  <li>account_transfer_in: Transferência entre contas (Entrada)</li>\n  <li>account_transfer_out: Transferência entre contas (Saída)</li>\n  <li>advance: Tarifa de Antecipação</li>\n  <li>misc: Outros</li>\n  <li>deposit: Depósito</li>\n  <li>payment: Pagamento de Contas</li>\n</ul>"
      operationId: extrato-consolidado
      parameters:
      - name: year
        in: query
        description: Ano*
        schema:
          type: integer
          format: int32
      - name: month
        in: query
        description: Mês*
        schema:
          type: integer
          format: int32
      - name: day
        in: query
        description: 'Dia* - Não traz o resultado para um dia específico, e sim a partir do dia informando no parâmetro. Exemplo: Se informa o dia "07" nesse parâmetro, a requisição vai trazer todas as entradas do dia 07 até o último dia do mês.'
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n  \"consolidated_statements\": [\n    {\n      \"id\": 974098447,\n      \"account_id\": \"QND6TZC2KXT5MN9I9IR44R3N3J94JBR5\",\n      \"movement_type\": \"start_balance\",\n      \"entry_date\": \"2024-06-25\",\n      \"total_amount_cents\": null,\n      \"entries_count\": 1,\n      \"entry_order\": 0,\n      \"total_amount\": \"2.59\"\n    },\n    {\n      \"id\": 974098448,\n      \"account_id\": \"QND6TZC2KXT5MN9I9IR44R3N3J94JBR5\",\n      \"movement_type\": \"end_balance\",\n      \"entry_date\": \"2024-06-25\",\n      \"total_amount_cents\": null,\n      \"entries_count\": 1,\n      \"entry_order\": 30,\n      \"total_amount\": \"2.59\"\n    }\n  ]\n}"
              schema:
                type: object
                properties:
                  consolidated_statements:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                          example: 974098447
                          default: 0
                        account_id:
                          type: string
                          example: QND6TZC2KXT5MN9I9IR44R3N3J94JBR5
                        movement_type:
                          type: string
                          example: start_balance
                        entry_date:
                          type: string
                          example: '2024-06-25'
                        total_amount_cents: {}
                        entries_count:
                          type: integer
                          example: 1
                          default: 0
                        entry_order:
                          type: integer
                          example: 0
                          default: 0
                        total_amount:
                          type: string
                          example: '2.59'
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value: '{}'
              schema:
                type: object
                properties: {}
      deprecated: false
  /accounts/financial:
    get:
      summary: Extrato Financeiro
      description: 'Retorna o extrato financeiro de uma conta.


        <div class="magic-block-callout type-warning"><h3><i title="Warning" class="fa fa-exclamation-circle"></i>Atenção</h3><div class="callout-body"><p>Esta API obriga a utilização do <code>live_api_token</code> na autenticação da chamada. Somente em modo "produção" há movimentação de saldo na conta iugu.</p></div></div>'
      operationId: extrato-financeiro
      parameters:
      - name: year
        in: query
        description: Ano
        schema:
          type: string
      - name: month
        in: query
        description: Mês
        schema:
          type: string
      - name: day
        in: query
        description: Dia
        schema:
          type: string
      - name: limit
        in: query
        description: Limita em até 1.000 o número de registros listados. Embora recomendamos usar no máximo limit=100
        schema:
          type: integer
          format: int32
      - name: start
        in: query
        description: Quantos registros pular do início da pesquisa, usado para paginação. (ver no inicio da documentação)
        schema:
          type: integer
          format: int32
      - name: hl
        in: query
        description: Define o locale para formatação de valor. Pode ser "en" ou "pt-BR"
        schema:
          type: string
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n  \"transactions\": [\n    {\n      \"amount\": \"R$ 1,00\",\n      \"type\": \"credit\",\n      \"description\": \"Pagamento recebido: Fatura #4C6A54F52FF04A969A9170ABA3C9C710\",\n      \"entry_date\": \"2024-04-08\",\n      \"reference\": \"4C6A54F52FF04A969A9170ABA3C9C710\",\n      \"reference_type\": \"Invoice\",\n      \"account_id\": \"27016E1AD888499A98994E781B6C3762\",\n      \"transaction_type\": \"misc\",\n      \"invoice_email\": \"js@email.com\",\n      \"customer_name\": null,\n      \"amount_cents\": \"100.0\",\n      \"balance\": \"R$ 2,61\",\n      \"balance_cents\": \"261.0\",\n      \"customer_ref\": \"js@email.com\",\n      \"payer_name\": null\n    },\n    {\n      \"amount\": \"R$ -0,01\",\n      \"type\": \"debit\",\n      \"description\": \"Tarifas - Pagamento recebido: Fatura #4C6A54F52FF04A969A9170ABA3C9C710\",\n      \"entry_date\": \"2024-04-08\",\n      \"reference\": \"4C6A54F52FF04A969A9170ABA3C9C710\",\n      \"reference_type\"\
                    : \"Invoice\",\n      \"account_id\": \"27016E1AD888499A98994E781B6C3762\",\n      \"transaction_type\": \"misc\",\n      \"invoice_email\": \"js@email.com\",\n      \"customer_name\": null,\n      \"amount_cents\": \"-1.0\",\n      \"balance\": \"R$ 2,60\",\n      \"balance_cents\": \"260.0\",\n      \"customer_ref\": \"js@email.com\",\n      \"payer_name\": null\n    },\n    {\n      \"amount\": \"R$ -1,00\",\n      \"type\": \"debit\",\n      \"description\": \"Transferencia de Conta#27016e1a-d888-499a-9899-4e781b6c3762 para Conta#0d16c52d-d91f-413b-acfa-24fd6868b18a\",\n      \"entry_date\": \"2024-04-10\",\n      \"reference\": \"94320E0695DE40FF919D82A0A17D012C\",\n      \"reference_type\": \"Transfer\",\n      \"account_id\": null,\n      \"transaction_type\": \"misc\",\n      \"invoice_email\": null,\n      \"customer_name\": null,\n      \"amount_cents\": \"-100.0\",\n      \"balance\": \"R$ 1,60\",\n      \"balance_cents\": \"160.0\",\n      \"customer_ref\"\
                    : null,\n      \"payer_name\": null\n    },\n    {\n      \"amount\": \"R$ -1,00\",\n      \"type\": \"debit\",\n      \"description\": \"Transferencia de Conta#27016e1a-d888-499a-9899-4e781b6c3762 para Conta#0d16c52d-d91f-413b-acfa-24fd6868b18a\",\n      \"entry_date\": \"2024-04-29\",\n      \"reference\": \"7839481C235A47C088987FE94360E9BD\",\n      \"reference_type\": \"Transfer\",\n      \"account_id\": null,\n      \"transaction_type\": \"misc\",\n      \"invoice_email\": null,\n      \"customer_name\": null,\n      \"amount_cents\": \"-100.0\",\n      \"balance\": \"R$ 0,60\",\n      \"balance_cents\": \"60.0\",\n      \"customer_ref\": null,\n      \"payer_name\": null\n    }\n  ],\n  \"initial_balance\": {\n    \"amount\": \"R$ 1,61\",\n    \"amount_cents\": \"161.0\",\n    \"entry_date\": \"2024-03-31\"\n  },\n  \"initial_date\": \"2024-03-31T00:00:00-03:00\",\n  \"final_date\": \"2024-04-30T13:12:04-03:00\",\n  \"transactions_total\": 4\n}"
              schema:
                type: object
                properties:
                  transactions:
                    type: array
                    items:
                      type: object
                      properties:
                        amount:
                          type: string
                          example: R$ 1,00
                        type:
                          type: string
                          example: credit
                        description:
                          type: string
                          example: 'Pagamento recebido: Fatura #4C6A54F52FF04A969A9170ABA3C9C710'
                        entry_date:
                          type: string
                          example: '2024-04-08'
                        reference:
                          type: string
                          example: 4C6A54F52FF04A969A9170ABA3C9C710
                        reference_type:
                          type: string
                          example: Invoice
                        account_id:
                          type: string
                          example: 27016E1AD888499A98994E781B6C3762
                        transaction_type:
                          type: string
                          example: misc
                        invoice_email:
                          type: string
                          example: js@email.com
                        customer_name: {}
                        amount_cents:
                          type: string
                          example: '100.0'
                        balance:
                          type: string
                          example: R$ 2,61
                        balance_cents:
                          type: string
                          example: '261.0'
                        customer_ref:
                          type: string
                          example: js@email.com
                        payer_name: {}
                  initial_balance:
                    type: object
                    properties:
                      amount:
                        type: string
                        example: R$ 1,61
                      amount_cents:
                        type: string
                        example: '161.0'
                      entry_date:
                        type: string
                        example: '2024-03-31'
                  initial_date:
                    type: string
                    example: '2024-03-31T00:00:00-03:00'
                  final_date:
                    type: string
                    example: '2024-04-30T13:12:04-03:00'
                  transactions_total:
                    type: integer
                    example: 4
                    default: 0
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value: '{}'
              schema:
                type: object
                properties: {}
      deprecated: false
  /accounts/financial/settled:
    get:
      summary: Extrato Consolidado de Liquidados
      description: Retorna o extrato de transações liquidadas e pagamentos pendentes/efetivados. Apenas disponível para o ambiente produção.
      operationId: extrato-consolidado-de-liquidados
      parameters:
      - name: date
        in: query
        description: Data, precisa ser menor ou igual ao dia anterior (AAAA-MM-DD)
        schema:
          type: string
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n  \"date\": \"2024-08-16\",\n  \"total_transactions_amount\": 0,\n  \"total_payments_amount\": 112344,\n  \"transactions\": [],\n  \"payments\": {\n    \"self\": [\n      {\n        \"amount_cents\": 0,\n        \"transaction_code\": \"MCC\",\n        \"payment_date\": null\n      },\n      {\n        \"amount_cents\": 0,\n        \"transaction_code\": \"ECC\",\n        \"payment_date\": null\n      },\n      {\n        \"amount_cents\": 0,\n        \"transaction_code\": \"VCC\",\n        \"payment_date\": null\n      }\n    ],\n    \"external\": [\n      {\n        \"amount_cents\": 12345,\n        \"transaction_code\": \"VCC\",\n        \"payment_date\": null,\n        \"destination_document\": \"12300078000000\",\n        \"destination_document\": \"12300078000000\",\n        \"destination_branch\": \"1234\",\n        \"destination_account\": \"123456\"\n      },\n      {\n        \"amount_cents\": 12346,\n        \"transaction_code\": \"MCC\",\n        \"\
                    payment_date\": null,\n        \"destination_document\": \"12300078000000\",\n        \"destination_branch\": \"1234\",\n        \"destination_account\": \"123456\"\n      },\n      {\n        \"amount_cents\": 87653,\n        \"transaction_code\": \"ECC\",\n        \"payment_date\": null,\n        \"destination_document\": \"12300078000000\",\n        \"destination_branch\": \"1234\",\n        \"destination_account\": \"123456\"\n      }\n    ]\n  }\n}"
              schema:
                type: object
                properties:
                  date:
                    type: string
                    example: '2024-08-16'
                  total_transactions_amount:
                    type: integer
                    example: 0
                    default: 0
                  total_payments_amount:
                    type: integer
                    example: 112344
                    default: 0
                  transactions:
                    type: array
                    items:
                      type: object
                      properties: {}
                  payments:
                    type: object
                    properties:
                      self:
                        type: array
                        items:
                          type: object
                          properties:
                            amount_cents:
                              type: integer
                              example: 0
                              default: 0
                            transaction_code:
                              type: string
                              example: MCC
                            payment_date: {}
                      external:
                        type: array
                        items:
                          type: object
                          properties:
                            amount_cents:
                              type: integer
                              example: 12345
                              default: 0
                            transaction_code:
                              type: string
                              example: VCC
                            payment_date: {}
                            destination_document:
                              type: string
                              example: '12300078000000'
                            destination_branch:
                              type: string
                              example: '1234'
                            destination_account:
                              type: string
                              example: '123456'
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n \"error\"\n}"
      deprecated: false
  /accounts/invoices:
    get:
      summary: Extrato de Faturas
      description: Retorna o extrato de faturas de uma conta.
      operationId: extrato-de-faturas
      parameters:
      - name: year
        in: query
        description: Ano
        schema:
          type: string
      - name: month
        in: query
        description: Mês
        schema:
          type: string
