  /accounts/consolidated_receivables:
    get:
      summary: Recebíveis Consolidados
      description: "Recebíveis Consolidados por: Data de Liquidação e Bandeira\n\n<div class=\"magic-block-callout type-warning\">\n<h3><i title=\"Warning\" class=\"fa fa-exclamation-circle\"></i>Atenção</h3>\n<div class=\"callout-body\">\n<p>\nEsta API obriga a utilização do <code>live_api_token</code> na autenticação da chamada. Somente em modo \"produção\" há movimentação de saldo na conta iugu.\n</p>\n</div>\n</div>\n\n<b>Tipos de transaction_code</b>\n\n<ul>\n  <li> VCC: visa </li>\n  <li> ECC: elo </li>\n  <li> DBC: discover </li>\n  <li> CBC: cabal </li>\n  <li> ACC: amex </li>\n  <li> HCC: hipercard </li>\n  <li> ACC: american_express </li>\n  <li> MCC: mastercard </li>\n  <li> MCC: master </li>\n  <li> MCC: maes </li>\n  <li> MCC: maestro </li>\n  <li> DCC: diners </li>\n  <li> SCC: sorocred </li>\n  <li> DCC: diners_club </li>\n  <li> DCC: diner_s_club </li>\n  <li> BCC: banescard </li>\n  <li> GCC: goodcard </li>\n  <li> JCC: jcb </li>\n  <li> VDC: verdecard </li>\n  <li> AGC:\
        \ agiplan </li>\n  <li> RCC: redesplan </li>\n  <li> AVC: avista </li>\n  <li> MAC: mais </li>\n  <li> CUP: cup </li>\n  <li> CSC: credi_shop </li>\n  <li> DAC: dacasa </li>\n  <li> AUC: aura </li>\n  <li> CZC: credz </li>\n  <li> FRC: fortbrasil </li>\n  <li> MXC: maxifrota </li>\n  <li> SFC: senff </li>\n  <li> TKC: ticketlog </li>\n  <li> BNC: banesecard </li>\n  <li> CCD: calcard </li>\n  <li> BRC: brasil_card </li>\n  <li> SPC: sem_parar </li>\n  <li> CAC: cielo_amex </li>\n</ul>"
      operationId: recebiveis-consolidados
      parameters:
      - name: scheduled_date_from
        in: query
        description: Data Agendada para liquidação (Inicio)
        schema:
          type: string
          format: date
      - name: scheduled_date_to
        in: query
        description: Data Agendada para liquidação (Fim)
        schema:
          type: string
          format: date
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n    \"consolidated_receivables\": [\n        {\n            \"id\": 111111111,\n            \"account_id\": \"0000000000000000000000000000000\",\n            \"cpf_cnpj\": \"0000000000000\",\n            \"entry_date\": \"2024-08-16\",\n            \"scheduled_date\": \"2024-07-06\",\n            \"pending_amount_cents\": 0,\n            \"pending_client_share_cents\": 0,\n            \"pending_fees_cents\": 0,\n            \"pending_splits_cents\": 0,\n            \"pending_count\": 0,\n            \"done_amount_cents\": 0,\n            \"done_client_share_cents\": 0,\n            \"done_fee_cents\": 0,\n            \"done_split_cents\": 0,\n            \"done_advance_fee_cents\": 0,\n            \"done_count\": 0,\n            \"canceled_amount_cents\": 400,\n            \"canceled_client_share_cents\": 222,\n            \"canceled_fee_cents\": 58,\n            \"canceled_split_cents\": 120,\n            \"canceled_advance_fee_cents\": 0,\n            \"canceled_count\"\
                    : 1,\n            \"booked_amount_cents\": 0,\n            \"booked_client_share_cents\": 0,\n            \"booked_fee_cents\": 0,\n            \"booked_split_cents\": 0,\n            \"booked_advance_fee_cents\": 0,\n            \"booked_count\": 0,\n            \"total_amount_cents\": 400,\n            \"total_client_share_cents\": 222,\n            \"total_fee_cents\": 58,\n            \"total_split_cents\": 120,\n            \"total_advance_fee_cents\": 0,\n            \"total_entries_count\": 1,\n            \"transaction_code\": \"VCC\",\n            \"advance_fee_today\": \"-0.0474\",\n            \"advance_fee_amount_cents_today\": null,\n            \"agreement_effects_count\": 4,\n            \"done_advance_count\": 0,\n            \"done_advance_amount_cents\": 0,\n            \"amount_availableble_for_advance_today_cents\": null,\n            \"agreement_effects_amount_cents\": null,\n            \"chargeback_pending_amount_cents\": 0,\n            \"chargeback_pending_count\"\
                    : 0,\n            \"chargeback_contested_amount_cents\": 0,\n            \"chargeback_contested_count\": 0,\n            \"chargeback_lost_amount_cents\": 0,\n            \"chargeback_lost_count\": 0,\n            \"chargeback_won_amount_cents\": 0,\n            \"chargeback_won_count\": 0\n        },\n        {\n            \"id\": 000000004,\n            \"account_id\": \"00000000000000000000000000\",\n            \"cpf_cnpj\": \"00000000000000\",\n            \"entry_date\": \"2024-08-16\",\n            \"scheduled_date\": \"2024-07-12\",\n            \"pending_amount_cents\": 0,\n            \"pending_client_share_cents\": 0,\n            \"pending_fees_cents\": 0,\n            \"pending_splits_cents\": 0,\n            \"pending_count\": 0,\n            \"done_amount_cents\": 0,\n            \"done_client_share_cents\": 0,\n            \"done_fee_cents\": 0,\n            \"done_split_cents\": 0,\n            \"done_advance_fee_cents\": 0,\n            \"done_count\"\
                    : 0,\n            \"canceled_amount_cents\": 600,\n            \"canceled_client_share_cents\": 348,\n            \"canceled_fee_cents\": 72,\n            \"canceled_split_cents\": 180,\n            \"canceled_advance_fee_cents\": 0,\n            \"canceled_count\": 1,\n            \"booked_amount_cents\": 0,\n            \"booked_client_share_cents\": 0,\n            \"booked_fee_cents\": 0,\n            \"booked_split_cents\": 0,\n            \"booked_advance_fee_cents\": 0,\n            \"booked_count\": 0,\n            \"total_amount_cents\": 600,\n            \"total_client_share_cents\": 348,\n            \"total_fee_cents\": 72,\n            \"total_split_cents\": 180,\n            \"total_advance_fee_cents\": 0,\n            \"total_entries_count\": 1,\n            \"transaction_code\": \"MCC\",\n            \"advance_fee_today\": \"-0.0404\",\n            \"advance_fee_amount_cents_today\": null,\n            \"agreement_effects_count\": 4,\n            \"done_advance_count\"\
