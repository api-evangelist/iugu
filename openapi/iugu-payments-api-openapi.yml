tags:
- name: Payments
paths:
  /payments/pix:
    put:
      summary: Ativar/desativar Pix
      description: Ative ou desative o método Pix. Ao requisitá-la, é criada uma chave EVP no BACEN.
      operationId: baas-ativar-desativar-pix
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                enable:
                  type: boolean
                  description: Habilita ou Desabilita o Pix. Ao habilitar, será gerada uma chave virtual do tipo EVP no Banco Central.
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n    \"success\": true\n}"
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                    default: true
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value: '{}'
              schema:
                type: object
                properties: {}
            text/plain:
              examples:
                Result:
                  value: "{\n  \"errors\": {\n    \"base\": [\n      \"Conta já possui Pix ativo\"\n    ]\n  }\n}"
              schema:
                type: object
                properties:
                  errors:
                    type: object
                    properties:
                      base:
                        type: array
                        items:
                          type: string
                          example: Conta já possui Pix ativo
      deprecated: false
      tags:
      - Payments
    servers:
    - url: https://api.iugu.com/v1
components:
  securitySchemes:
    sec0:
      type: apiKey
      in: query
      name: api_token
