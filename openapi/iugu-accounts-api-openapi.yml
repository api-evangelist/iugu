openapi: 3.2.0
info:
  title: Iugu Accounts API
  version: '1.0'
  description: 'Operations tagged Accounts across 3 of this provider''s published API definitions: iugu-baas-openapi.yml, iugu-conta-de-pagamento-e-marketplace-openapi.yml, iugu-relat-rios-para-concilia-o-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.iugu.com/v1
security:
- sec0: []
tags:
- name: Accounts
paths:
  /accounts/financial:
    get:
      summary: Extrato Financeiro
      description: 'Utilize o `live_api_token` ou `test_api_token` da subconta ou conta mestre.


        Retorna o extrato financeiro de uma conta. **Importante: ** Somente em modo produção há movimentação de saldo na conta iugu.'
      operationId: baas-extrato-financeiro
      parameters:
      - name: year
        in: query
        description: Ano
        schema:
          type: string
      - name: month
        in: query
        description: Mês
        schema:
          type: string
      - name: day
        in: query
        description: Dia
        schema:
          type: string
      - name: limit
        in: query
        description: Limita em até 1.000 o número de registros listados. Embora recomendamos usar no máximo limit=100
        schema:
          type: integer
          format: int32
      - name: start
        in: query
        description: Quantos registros pular do início da pesquisa, usado para paginação. (ver no inicio da documentação)
        schema:
          type: integer
          format: int32
      - name: hl
        in: query
        description: Define o locale para formatação de valor. Pode ser "en" ou "pt-BR"
        schema:
          type: string
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n  \"transactions\": [\n    {\n      \"amount\": \"R$ 1,00\",\n      \"type\": \"credit\",\n      \"description\": \"Pagamento recebido: Fatura #4C6A54F52FF04A969A9170ABA3C9C710\",\n      \"entry_date\": \"2024-04-08\",\n      \"reference\": \"4C6A54F52FF04A969A9170ABA3C9C710\",\n      \"reference_type\": \"Invoice\",\n      \"account_id\": \"27016E1AD888499A98994E781B6C3762\",\n      \"transaction_type\": \"misc\",\n      \"invoice_email\": \"js@email.com\",\n      \"customer_name\": null,\n      \"amount_cents\": \"100.0\",\n      \"balance\": \"R$ 2,61\",\n      \"balance_cents\": \"261.0\",\n      \"customer_ref\": \"js@email.com\",\n      \"payer_name\": null\n    },\n    {\n      \"amount\": \"R$ -0,01\",\n      \"type\": \"debit\",\n      \"description\": \"Tarifas - Pagamento recebido: Fatura #4C6A54F52FF04A969A9170ABA3C9C710\",\n      \"entry_date\": \"2024-04-08\",\n      \"reference\": \"4C6A54F52FF04A969A9170ABA3C9C710\",\n      \"reference_type\": \"Invoice\",\n      \"account_id\": \"27016E1AD888499A98994E781B6C3762\",\n      \"transaction_type\": \"misc\",\n      \"invoice_email\": \"js@email.com\",\n      \"customer_name\": null,\n      \"amount_cents\": \"-1.0\",\n      \"balance\": \"R$ 2,60\",\n      \"balance_cents\": \"260.0\",\n      \"customer_ref\": \"js@email.com\",\n      \"payer_name\": null\n    },\n    {\n      \"amount\": \"R$ -1,00\",\n      \"type\": \"debit\",\n      \"description\": \"Transferencia de Conta#27016e1a-d888-499a-9899-4e781b6c3762 para Conta#0d16c52d-d91f-413b-acfa-24fd6868b18a\",\n      \"entry_date\": \"2024-04-10\",\n      \"reference\": \"94320E0695DE40FF919D82A0A17D012C\",\n      \"reference_type\": \"Transfer\",\n      \"account_id\": null,\n      \"transaction_type\": \"misc\",\n      \"invoice_email\": null,\n      \"customer_name\": null,\n      \"amount_cents\": \"-100.0\",\n      \"balance\": \"R$ 1,60\",\n      \"balance_cents\": \"160.0\",\n      \"customer_ref\": null,\n      \"payer_name\": null\n    },\n    {\n      \"amount\": \"R$ -1,00\",\n      \"type\": \"debit\",\n      \"description\": \"Transferencia de Conta#27016e1a-d888-499a-9899-4e781b6c3762 para Conta#0d16c52d-d91f-413b-acfa-24fd6868b18a\",\n      \"entry_date\": \"2024-04-29\",\n      \"reference\": \"7839481C235A47C088987FE94360E9BD\",\n      \"reference_type\": \"Transfer\",\n      \"account_id\": null,\n      \"transaction_type\": \"misc\",\n      \"invoice_email\": null,\n      \"customer_name\": null,\n      \"amount_cents\": \"-100.0\",\n      \"balance\": \"R$ 0,60\",\n      \"balance_cents\": \"60.0\",\n      \"customer_ref\": null,\n      \"payer_name\": null\n    }\n  ],\n  \"initial_balance\": {\n    \"amount\": \"R$ 1,61\",\n    \"amount_cents\": \"161.0\",\n    \"entry_date\": \"2024-03-31\"\n  },\n  \"initial_date\": \"2024-03-31T00:00:00-03:00\",\n  \"final_date\": \"2024-04-30T13:12:04-03:00\",\n  \"transactions_total\": 4\n}"
              schema:
                type: object
                properties:
                  transactions:
                    type: array
                    items:
                      type: object
                      properties:
                        amount:
                          type: string
                          example: R$ 1,00
                        type:
                          type: string
                          example: credit
                        description:
                          type: string
                          example: 'Pagamento recebido: Fatura #4C6A54F52FF04A969A9170ABA3C9C710'
                        entry_date:
                          type: string
                          example: '2024-04-08'
                        reference:
                          type: string
                          example: 4C6A54F52FF04A969A9170ABA3C9C710
                        reference_type:
                          type: string
                          example: Invoice
                        account_id:
                          type: string
                          example: 27016E1AD888499A98994E781B6C3762
                        transaction_type:
                          type: string
                          example: misc
                        invoice_email:
                          type: string
                          example: js@email.com
                        customer_name: {}
                        amount_cents:
                          type: string
                          example: '100.0'
                        balance:
                          type: string
                          example: R$ 2,61
                        balance_cents:
                          type: string
                          example: '261.0'
                        customer_ref:
                          type: string
                          example: js@email.com
                        payer_name: {}
                  initial_balance:
                    type: object
                    properties:
                      amount:
                        type: string
                        example: R$ 1,61
                      amount_cents:
                        type: string
                        example: '161.0'
                      entry_date:
                        type: string
                        example: '2024-03-31'
                  initial_date:
                    type: string
                    example: '2024-03-31T00:00:00-03:00'
                  final_date:
                    type: string
                    example: '2024-04-30T13:12:04-03:00'
                  transactions_total:
                    type: integer
                    example: 4
                    default: 0
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value: '{}'
              schema:
                type: object
                properties: {}
      deprecated: false
      tags:
      - Accounts
    servers:
    - url: https://api.iugu.com/v1
  /accounts/{account_id}/request_verification:
    post:
      summary: Enviar Verificação de Conta iugu
      description: 'Utilize `user_token` nesta requisição.


        Esse endpoint permite o envio de informações para a verificação de subcontas. Por motivos de segurança, enquanto uma subconta estiver pendente de verificação, somente serão aceitas requisições com o `test_api_token`. Caso o `user_token` ou `live_api_token` seja utilizado em subcontas não verificadas, a API retornará a mensagem `401` `Unauthorized` para qualquer requisição, incluindo operações como Criação de Clientes, Criação e Captura de Faturas, entre outras.'
      operationId: baas-enviar-verificacao-de-conta
      parameters:
      - name: account_id
        in: path
        description: ID da Conta
        schema:
          type: string
        required: true
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  type: object
                  description: Dados cadastrais da conta, como Endereço, Nome do Titular etc.
                  required:
                  - price_range
                  - physical_products
                  - business_type
                  - person_type
                  - automatic_transfer
                  - street
                  - number
                  - cep
                  - city
                  - state
                  - telephone
                  - estimated_revenue
                  - bank
                  - bank_cc
                  - bank_ag
                  - account_type
                  - politically_exposed_person
                  - website
                  properties:
                    price_range:
                      type: string
                      description: Valor máximo da venda (`Até R$ 100,00`, `Entre R$ 100,00 e R$ 500,00`, `Mais que R$ 500,00`). Não interfere no valor máximo das Faturas.
                    physical_products:
                      type: boolean
                      description: Vende produtos físicos?
                      default: 'false'
                    business_type:
                      type: string
                      description: Descrição do Negócio
                    person_type:
                      type: string
                      description: '`Pessoa Física` ou `Pessoa Jurídica`'
                    politically_exposed_person:
                      type: boolean
                      description: Informe se você é uma Pessoa Politicamente Exposta, ou seja, se ocupa ou ocupou cargo público relevante, incluindo familiares ou pessoas com relacionamento próximo, conforme exigências de conformidade regulatória.
                    automatic_transfer:
                      type: boolean
                      description: Saque automático. Envie `true` para habilitar o saque automático. <br><br>Este parâmetro **sobrepõe a configuração** enviada durante a criação da Subconta.
                      default: 'false'
                    cnpj:
                      type: string
                      description: CNPJ. Se `person_type` é `Pessoa Jurídica`. (Aceita o tipo alfanumérico).
                    cpf:
                      type: string
                      description: CPF do titular. **Obrigatório** se `person_type` é `Pessoa Física`.
                    company_name:
                      type: string
                      description: Nome da Companhia. **Obrigatório** se `person_type` é `Pessoa Jurídica`.
                    name:
                      type: string
                      description: Nome do Titular. **Obrigatório** se `person_type` é `Pessoa Física`.
                    street:
                      type: string
                      description: Rua
                    number:
                      type: string
                      description: Número do endereço
                    complement:
                      type: string
                      description: Complemento do endereço
                    cep:
                      type: string
                      description: CEP do Titular ou Companhia. **Formato:** 00000-000
                    city:
                      type: string
                      description: Cidade do Titular ou Companhia
                    district:
                      type: string
                      description: Bairro do Titular ou Companhia
                    state:
                      type: string
                      description: Estado do Titular ou Companhia. Nome ou UF.
                    telephone:
                      type: string
                      description: Telefone do Titular ou Companhia
                    resp_name:
                      type: string
                      description: Nome do Responsável da Companhia. **Obrigatório** se `person_type` é `Pessoa Jurídica`.
                    resp_cpf:
                      type: string
                      description: CPF do Responsável da Companhia. **Obrigatório** se `person_type` é `Pessoa Jurídica`.
                    estimated_revenue:
                      type: string
                      description: <br> **Importante ⚠️**<br> Apesar de ser estimado, informe algo aproximado Renda estimada do titular da Conta <br><br> **Pessoa Física:** Renda estimada <br> **Pessoa Jurídica:** Faturamento anual
                    bank:
                      type: string
                      description: 'Nome do Banco para Domicílio Bancário. Utilize uma das strings a seguir: <br><br> `Itaú`, `Bradesco/Next`, `Caixa Econômica`, `Banco do Brasil`, `Santander`, `Banrisul`, `Sicredi`, `Sicoob`, `Inter`, `BRB`, `Via Credi/Civia Cooperativa`, `Neon`, `Votorantim`, `Banco Letsbank S.A`, `Nubank`, `Pagseguro`, `Banco Original`, `Safra`, `Modal`, `Banestes`, `Unicred`, `Money Plus`, `Mercantil do Brasil`, `JP Morgan`, `Gerencianet Pagamentos do Brasil`, `Banco C6`, `BS2`, `Banco Topazio`, `Uniprime`, `Stone`, `Banco Daycoval`, `Rendimento`, `Banco do Nordeste`, `Citibank`, `PJBank/Dock IP S.A.`, `Cooperativa Central de Credito Noroeste Brasileiro`, `Uniprime Norte do Paraná`, `Global SCM`, `Cora`, `Mercado Pago`, `Banco da Amazonia`, `BNP Paribas Brasil`, `Juno`, `Cresol`, `BRL Trust DTVM`, `Banco Banese`, `Banco BTG Pactual`, `Banco Omni`, `Acesso Soluções de Pagamento`, `CCR de São Miguel do Oeste`, `Polocred`, `Ótimo`, `Banco Ribeirão Preto`, `ASAAS IP`, `Banco Pan`, `Neon`, `VORTX DTVM LTDA`, `Banco BMG`, `Pefisa`, `J17 - SCD S/A`, `Credisan`, `Pinbank`, `XP Investimentos`, `Crefisa`, `Singulare`, `SUMUP SCD S.A.`, `Banco ABC Brasil`, `BCO LETSBANK S.A.`, `HR Digital Sociedade de Crédito Direto S.A`, `BANCO XP S.A.`, `Neon Pagamentos S.A. IP`, `CLOUD WALK MEIOS DE PAGAMENTOS E SERVICOS LTDA`, `BCO SOFISA S.A.`, `BANCO BV S.A.`, `CELCOIN INSTITUICAO DE PAGAMENTO S.A.`, `SUPERDIGITAL I.P. S.A.`, `BCO FIBRA S.A.`, `UY3 SCD S/A`, `QI Sociedade de Crédito`, `LISTO SCD S.A`, `ID CORRETORA DE TÍTULOS E VALORES MOBILIÁRIOS S.A`, `CARTOS SCD S.A.`, `PagPrime IP`, `MONETARIE SOCIEDADE DE CRÉDITO DIRETO S.A`'
                    bank_cc:
                      type: string
                      description: Número da Conta
                    bank_ag:
                      type: string
                      description: Agência da Conta
                    account_type:
                      type: string
                      description: Tipo do Conta. `Corrente`, `Poupança` ou `Pagamento`.
                    website:
                      type: string
                      description: 'Deve começar com http:// ou https://. <br>Exemplo: http://www.exemplo.com/</br>'
                files:
                  type: object
                  description: 'Formatado em `Base64`. Limite de 10 MB por arquivo. <br><br>**Atenção**<br>O campo `identification` deve ser preenchido para envio de um documento único, com **Frente** e **Verso**.<br>Para o envio de documentos separados, deverá usar os campos `identification_front` (**Frente**) e `identification_back` (**Verso**). <br><br>Extensões de arquivos aceitas: <br>`.pdf`, `.png`, `.jpeg`, `.jpg`, `.bmp`, `.webp`, `.heic`, `.heif`.'
                  required:
                  - identification
                  - selfie
                  properties:
                    identification:
                      type: string
                      description: Documento de Identificação Pessoal do Titular da Conta (frente e verso) — RG, CNH ou Passaporte  <br><br> **RG:** físico ou digital com QR Code <br> **CNH:** físico ou digital com QR Code <br> **Passaporte:** físico ou digital
                      format: binary
                    identification_front:
                      type: string
                      description: Documento de Identificação Pessoal do Titular da Conta **Frente** <br> **Obrigatório** se campo `identification` não for preenchido. <br><br> **RG:** físico ou digital com QR Code <br> **CNH:** físico ou digital com QR Code <br> **Passaporte:** físico ou digital
                      format: binary
                    identification_back:
                      type: string
                      description: Documento de Identificação Pessoal do Titular da Conta **Verso** <br> **Obrigatório** se campo `identification` não for preenchido. <br><br> **RG:** físico ou digital com QR Code <br> **CNH:** físico ou digital com QR Code <br> **Passaporte:** físico ou digital
                      format: binary
                    selfie:
                      type: string
                      description: Selfie (foto) do Titular da Conta — **Importante:** Deve ser tirada pela própria pessoa, sem interferência de terceiros, para garantir autenticidade. <br><br> **CNPJ (`person_type` = `Pessoa Jurídica`):** Representante legal da companhia
                      format: binary
                    address_proof:
                      type: string
                      description: Comprovante de Endereço do Titular da Conta. <br><br>**Importante**<br> O documento deve conter nome, endereço completo, código de barras, valor da fatura e data da emissão.<br><br> **Tipos de Contas**<br>Luz, energia, água, telefone fixou ou celular, internet ou faturas de instituições financeiras dos últimos **90 dias**. <br><br>**CNPJ (`person_type` = `Pessoa Jurídica`):** Envie Comprovante de Endereço da **companhia**.
                      format: binary
                    balance_sheet:
                      type: string
                      description: Relatório Financeiro da Companhia dos últimos **12 meses com a assinatura do representante legal e do contador (deve conter nome e CRC do contador)**.<br><br> **Tipos de Documento ** <br> Declaração de que não há Faturamento <br> Declaração de Faturamento simples <br> Relação de Faturamento Pessoa Jurídica <br> Extrato do SIMEI <br> Declaração anual do SIMEI <br> Declaração de Informações Socioeconômicas e Fiscais (DEFIS)
                      format: binary
                    social_contract:
                      type: string
                      description: Contrato Social. **Obrigatório** se `person_type` é `Pessoa Jurídica`.
                      format: binary
                    additional_document_one:
                      type: string
                      description: Documento extra `1`
                      format: binary
                    additional_document_two:
                      type: string
                      description: Documento extra `2`
                      format: binary
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value:
                    id: 5F0610FC05AA4EF391738124B312BBFA
                    data:
                      price_range: Entre R$ 100,00 e R$ 500,00
                      physical_products: true
                      business_type: loja
                      person_type: Pessoa Física
                      politically_exposed_person: false
                      automatic_transfer: true
                      cpf: '32180839073'
                      name: teste
                      address: Rua Dom Rosalvo 140
                      cep: 05442903
                      city: São Paulo
                      state: SP
                      telephone: '11970775947'
                      bank: Caixa Econômica
                      bank_ag: '0001'
                      account_type: Corrente
                      bank_cc: 7XXXXXX1-2
                      resp_cpf: testes
                      bank_ispb: '00360305'
                    account_id: 3A605D267BBD4B41BC6CCF2CCA086C4A
                    created_at: '2024-04-30T13:41:13-03:00'
              schema:
                type: object
                properties:
                  id:
                    type: string
                    example: 5F0610FC05AA4EF391738124B312BBFA
                  data:
                    type: object
                    properties:
                      price_range:
                        type: string
                        example: Entre R$ 100,00 e R$ 500,00
                      physical_products:
                        type: boolean
                        example: true
                        default: true
                      business_type:
                        type: string
                        example: loja
                      person_type:
                        type: string
                        example: Pessoa Física
                      automatic_transfer:
                        type: boolean
                        example: true
                        default: true
                      cpf:
                        type: string
                        example: '32180839073'
                      name:
                        type: string
                        example: teste
                      address:
                        type: string
                        example: Rua Dom Rosalvo 140
                      cep:
                        type: string
                        example: 05442903
                      city:
                        type: string
                        example: São Paulo
                      state:
                        type: string
                        example: SP
                      telephone:
                        type: string
                        example: '11970775947'
                      bank:
                        type: string
                        example: Caixa Econômica
                      bank_ag:
                        type: string
                        example: '0001'
                      account_type:
                        type: string
                        example: Corrente
                      bank_cc:
                        type: string
                        example: 7XXXXXX1-2
                      resp_cpf:
                        type: string
                        example: testes
                      bank_ispb:
                        type: string
                        example: '00360305'
                  account_id:
                    type: string
                    example: 3A605D267BBD4B41BC6CCF2CCA086C4A
                  created_at:
                    type: string
                    example: '2024-04-30T13:41:13-03:00'
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value: '{}'
              schema:
                type: object
                properties: {}
      tags:
      - Accounts
    servers:
    - url: https://api.iugu.com/v1
  /accounts/{id}:
    get:
      summary: Informações da Conta
      description: 'Utilize o `live_api_token` ou `test_api_token` da subconta.


        Retorna informações de uma Subconta, como Saldo Disponível para Saque, se o Saque Automático está ligado ou não etc.'
      operationId: baas-informacoes-da-conta
      parameters:
      - name: id
        in: path
        description: ID da sub-conta
        schema:
          type: string
        required: true
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
