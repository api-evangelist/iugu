    put:
      summary: Editar Subconta
      description: 'Atualiza os parâmetros de uma conta de pagamentos.


        IMPORTANTE!


        Para executar esta chamada é necessário que a conta esteja verificada. Atenção: Para a Autenticação, no lugar do token de API da conta (api_token), deve-se utilizar o token de usuário (user_token), gerado no retorno da chamada de criação de subconta.'
      operationId: atualizar-subconta
      parameters:
      - name: id
        in: path
        description: ID da conta a ser atualizada.
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                subscriptions_billing_days:
                  type: integer
                  description: Número de dias antes do vencimento da assinatura para criação da fatura referente ao próximo ciclo.
                  format: int32
                subscriptions_trial_period:
                  type: integer
                  description: Duração (em dias) do período de testes de uma assinatura.
                  format: int32
                default_return_url:
                  type: string
                  description: URL padrão para a qual direcionar o cliente após o pagamento de uma fatura via web.
                owner_emails_to_notify:
                  type: string
                  description: Lista de emails, separados por vígula, que devem receber notificações específicas para usuários com permissão de "dono".
                reply_to:
                  type: string
                  description: E-mail para resposta dos clientes
                website:
                  type: string
                  description: Deve começar com http:// ou https://. <br>**Exemplo:** http://www.exemplo.com/</br>
                auto_withdraw_type:
                  type: string
                  description: 'Periodicidade da agenda: `daily`, `weekly`, `biweekly` ou `monthly`.<br>

                    Quando presente, ativa a agenda. Ausente ou vazio, desativa.

                    '
                auto_withdraw_option:
                  type: integer
                  description: 'Depende do `auto_withdraw_type`. Para `weekly` e `biweekly`: dia da semana de `1` a `5` (1= Segunda, 2= Terça, 3= Quarta, 4= Quinta, 5= Sexta). Para `monthly`: dia do mês de `1` a `31`. Não se aplica a `daily`.'
                  format: int32
                auto_withdraw_anchor_date:
                  type: string
                  description: 'Apenas `biweekly`: data de referência (início do ciclo) que define quais semanas são ativas. (Formato: ''AAAA-MM-DD''). <br> Obrigatória para `biweekly`; ignorada para os demais tipos.'
              required:
              - website
      responses:
        '200':
          description: '200'
          content:
            application/json:
