                    qrcode_text: 00020126180014br.gov.bcb.pix5204000053039865802BR5925IUGU INSTITUICAO DE PAGAM6006CIDADE62070503***80920014br.gov.bcb.pix2570qr.iugu.com/public/payload/v2/rec/3f7c9d21-84be-4a05-b1e2-6d5417c0af386304ED12
                    qrcode: 
      parameters: []
      summary: Pix Automático Recebedor - Jornada 2
      operationId: post_automatic-pix-receiver-recurrences
      description: Cria uma autorização de recorrência via Pix Automático (Jornada 2) sem gerar cobrança associada no momento da criação. Destinada a clientes que possuem motor de recorrência próprio e desejam migrar uma base já ativa (boleto, cartão ou Pix manual) para o débito automático, sem forçar uma cobrança fora do ciclo vigente. O endpoint retorna apenas o QR Code de recorrência. As cobranças de cada ciclo devem ser agendadas posteriormente através de POST /v1/invoices.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                payer:
                  type: object
                  description: Dados do pagador (devedor da recorrência)
                  properties:
                    name:
                      type: string
                      description: Nome do pagador
                    cpf_cnpj:
                      type: string
                      description: CPF ou CNPJ do pagador
                frequency:
                  type: string
                  description: 'Frequência das cobranças. Valores: `weekly`, `monthly`, `quarterly`, `semiannual`, `annual`'
                recurrence_beginning:
                  type: string
                  format: date
                  description: Data de início da recorrência (futura, formato AAAA-MM-DD)
                contract_number:
                  type: string
                  description: Identificador do contrato/pedido. Máx. 35 caracteres
                end_date:
                  type: string
                  format: date
                  description: Data de encerramento da recorrência (se informada, deve ser posterior a `recurrence_beginning`)
                retry_policy:
                  type: string
                  description: Política de retentativa. `retry_not_allowed` (padrão) ou `retry_allowed`
              required:
              - contract_number
              - recurrence_beginning
              - frequency
            examples: {}
      tags:
      - Automatic Pix
