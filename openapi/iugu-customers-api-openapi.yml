                    type: string
                    example: Customer Not Found
      deprecated: false
      tags:
      - Customers
    delete:
      summary: Remover Cliente
      description: Remove permanentemente um cliente. Porém, não permite remover clientes com assinaturas vinculadas.
      operationId: remover-cliente
      parameters:
      - name: id
        in: path
