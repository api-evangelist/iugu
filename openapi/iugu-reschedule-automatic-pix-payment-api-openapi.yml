- sec0: []
tags:
- name: Reschedule Automatic Pix Payment
paths:
  /{id}/reschedule_automatic_pix_payment:
    post:
      description: 'Solicita um novo agendamento de cobrança para uma fatura cujo débito foi cancelado por insuficiência de saldo. Esta operação só é disponível quando a recorrência foi criada com retry_policy: retry_allowed.'
      responses:
        '200':
          description: ''
        '400':
          content:
            application/json:
              schema:
                type: object
                properties: {}
              examples:
                'Bad Request - Conta não é PJ ':
                  summary: 'Bad Request - Conta não é PJ '
                  value:
                    errors:
                      automatic_pix: Only legal entity accounts can use Automatic PIX
                Bad Request - Fatura não expirada:
                  summary: Bad Request - Fatura não expirada
                  value:
                    errors:
                      automatic_pix: Only expired invoices can reschedule an Automatic PIX payment
                Bad Request - Janela de retentativa expirada:
                  summary: Bad Request - Janela de retentativa expirada
                  value:
                    errors:
                      automatic_pix: Automatic PIX payment rescheduling is only allowed within 7 days of expiration (BACEN rule)
          description: Bad Request
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
        description: UUID da fatura (expired) associada ao agendamento que falhou por insuficiência de saldo.
      operationId: post_id-reschedule-automatic-pix-payment
      summary: Solicitar Retentativa de Agendamento
      tags:
      - Reschedule Automatic Pix Payment
components:
  securitySchemes:
    sec0:
      type: apiKey
      name: api_token
      in: query
