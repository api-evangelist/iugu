                        qr_code_payload:
                          type: string
                          example: 00020126580014br.gov.bcb.pix013654f68fe2-bab3-4abb-abcf-2b6943ed3db65204000053039865406234.005802BR5922Bruna Cardoso da Silva6009Sao Paulo622605225nSCX5qpmT1MiCgWELDtb26304511E
