tags:
- name: Pix
paths:
  /pix/keys:
    get:
      summary: Consultar chave Pix na Conta iugu
      description: Consultar a chave PIX da Conta Iugu, funciona apenas em ambiente de **Produção**
      operationId: baas-consulta-de-chave-pix-conta-iugu
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: "[\n    {\n        \"key\": \"123e4f56-cce7-4255-b526-e0f33c3c3ce4\",\n        \"name\": \"Subconta Teste\",\n        \"created_at\": \"2023-08-17T20:53:49.835Z\",\n        \"start_date\": \"2023-08-17T20:53:49.835Z\",\n        \"type\": \"evp\"\n    }\n]"
              schema:
                type: array
                items:
                  type: object
                  properties:
                    key:
                      type: string
                      example: 123e4f56-cce7-4255-b526-e0f33c3c3ce4
                    name:
                      type: string
                      example: Subconta Teste
                    created_at:
                      type: string
                      example: '2023-08-17T20:53:49.835Z'
                    start_date:
                      type: string
                      example: '2023-08-17T20:53:49.835Z'
                    type:
                      type: string
                      example: evp
        '401':
          description: '401'
          content:
            application/json:
              examples:
                'return bad_request(recently_consulted: ''Already consulted 1 minute ago'')) if consulted_recently?(sanitized_key)':
                  value: "{\n    \"errors\": \"Apenas disponível para o ambiente produção\"\n}"
              schema:
                type: object
                properties:
                  errors:
                    type: string
                    example: Apenas disponível para o ambiente produção
      tags:
      - Pix
components:
  securitySchemes:
    sec0:
      type: apiKey
      name: api_token
      in: query
