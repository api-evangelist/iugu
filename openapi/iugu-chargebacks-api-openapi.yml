paths:
  /chargebacks:
    get:
      summary: Listar Contestação
      description: Retorna uma lista com todas as contestações de sua conta.
      operationId: listar-contestacao
      parameters:
      - name: created_at_from
        in: path
        description: Filtra por data de criação
        schema:
          type: string
          format: date
        required: true
      - name: created_at_to
        in: path
        description: Filtra por data de criação
        schema:
          type: string
          format: date
        required: true
      - name: status
        in: path
        description: 'Filtra pelos status: "pending", "processing_file", "error", "accepted_by_client", "contested_by_client", "waiting_resolution", "lost", "won", "accepted_automatically", "reverted".'
        schema:
          type: string
        required: true
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n    \"facets\": {\n        \"pending\": {\n            \"_type\": \"filter\",\n            \"count\": 2\n        }\n    },\n    \"items\": [\n        {\n            \"id\": \"14B31AF16A254F3C9E22927989B879D8\",\n            \"invoice_id\": \"C9FD4AB9603B4E919559ADD9082895B7\",\n            \"status\": \"pending\",\n            \"expires_at\": \"2017-07-05\"\n        },\n        {\n            \"id\": \"D5F4DC1583BC4B19A77814A2C5ABC092\",\n            \"invoice_id\": \"C4E1B42BBC5146ACAAB27B03ED5D34F8\",\n            \"status\": \"pending\",\n            \"expires_at\": \"2017-06-27\"\n        }\n    ]\n}"
              schema:
                type: object
                properties:
                  facets:
                    type: object
                    properties:
                      pending:
                        type: object
                        properties:
                          _type:
                            type: string
                            example: filter
                          count:
                            type: integer
                            example: 2
                            default: 0
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          example: 14B31AF16A254F3C9E22927989B879D8
                        invoice_id:
                          type: string
                          example: C9FD4AB9603B4E919559ADD9082895B7
                        status:
                          type: string
                          example: pending
                        expires_at:
                          type: string
                          example: '2017-07-05'
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value: '{}'
              schema:
                type: object
                properties: {}
      deprecated: false
      tags:
      - Chargebacks
  /chargebacks/{id}:
    get:
      summary: Buscar Contestação
      description: Retorna as informações de uma contestação.
      operationId: buscar-contestacao
      parameters:
      - name: id
        in: path
        description: ID da contestação
        schema:
          type: string
        required: true
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n  \"id\": \"14B31AF16A254F3C9E22927989B879D8\",\n  \"invoice_id\": \"C9FD4AB9603B4E919559ADD9082895B7\",\n  \"status\": \"pending\",\n  \"expires_at\": \"2017-07-05\"\n}"
              schema:
                type: object
                properties:
                  id:
                    type: string
                    example: 14B31AF16A254F3C9E22927989B879D8
                  invoice_id:
                    type: string
                    example: C9FD4AB9603B4E919559ADD9082895B7
                  status:
                    type: string
                    example: pending
                  expires_at:
                    type: string
                    example: '2017-07-05'
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value: '{}'
              schema:
                type: object
                properties: {}
      deprecated: false
      tags:
      - Chargebacks
  /chargebacks/{id}/accept:
    put:
      summary: Acatar Contestação
      description: Acata a solicitação de contestação.
      operationId: acatar-contestacao
      parameters:
      - name: id
        in: path
        description: ID da contestação
        schema:
          type: string
        required: true
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n  \"id\": \"14B31AF16A254F3C9E22927989B879D8\",\n  \"invoice_id\": \"C9FD4AB9603B4E919559ADD9082895B7\",\n  \"status\": \"accepted\",\n  \"expires_at\": \"2017-07-05\"\n}"
              schema:
                type: object
                properties:
                  id:
                    type: string
                    example: 14B31AF16A254F3C9E22927989B879D8
                  invoice_id:
                    type: string
                    example: C9FD4AB9603B4E919559ADD9082895B7
                  status:
                    type: string
                    example: accepted
                  expires_at:
                    type: string
