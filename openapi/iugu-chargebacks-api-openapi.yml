                  value: '{}'
              schema:
                type: object
                properties: {}
      deprecated: false
      tags:
      - Chargebacks
  /chargebacks/{id}/contest:
    put:
      summary: Disputar Contestação
      description: Abre uma disputa sobre a contestação.
      operationId: disputar-contestacao
      parameters:
      - name: id
        in: path
        description: ID da contestação
        schema:
          type: string
        required: true
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                file_1:
                  type: string
                  description: Enviar arquivo em base64
                  format: binary
                file_2:
                  type: string
                  description: Enviar arquivo em base64
                  format: binary
                file_3:
                  type: string
                  description: Enviar arquivo em base64
                  format: binary
                file_4:
                  type: string
                  description: Enviar arquivo em base64
                  format: binary
                file_5:
                  type: string
                  description: Enviar arquivo em base64
                  format: binary
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: ''
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value: '{}'
              schema:
                type: object
                properties: {}
      deprecated: false
      tags:
      - Chargebacks
