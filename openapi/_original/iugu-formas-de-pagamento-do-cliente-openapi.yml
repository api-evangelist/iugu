    post:
      summary: Criar Forma de Pagamento
      description: Cria uma forma de pagamento de cliente.
      operationId: criar-forma-de-pagamento
      parameters:
      - name: customer_id
        in: path
        description: ID do Cliente
        schema:
          type: string
        required: true
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - description
              - token
              properties:
                description:
                  type: string
                  description: Descrição
                token:
                  type: string
                  description: Token de Pagamento <a href="https://dev.iugu.com/docs/tokenização" target="_blank">criar</a>
                set_as_default:
                  type: boolean
                  description: Se "true" define esta Forma de Pagamento como padrão do Cliente, ou seja, para executar cobranças automáticas no cartão salvo.
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n  \"id\": \"9F9977E32DC74DC18266FD02454AB4F5\",\n  \"description\": \"Meu Master Roxinho\",\n  \"item_type\": \"credit_card\",\n  \"customer_id\": \"3B926491FC954603B886BC279A769D99\",\n  \"data\": {\n    \"brand\": \"Master\",\n    \"holder_name\": \"NOME NO KARTÃO\",\n    \"display_number\": \"XXXX-XXXX-XXXX-4444\",\n    \"bin\": \"555555\",\n    \"year\": 2030,\n    \"month\": 12,\n    \"last_digits\": \"4444\",\n    \"first_digits\": \"555555\",\n    \"masked_number\": \"XXXX-XXXX-XXXX-4444\",\n    \"fingerprint\": \"39124eb1-9813-ee72-f5df-75725cd9a5c0\",\n    \"issuer\": \"Informação não disponivel\",\n    \"card_type\": \"Multiplo\",\n    \"foreign_card\": \"t\"\n  }\n}"
              schema:
                type: object
                properties:
                  id:
                    type: string
                    example: 9F9977E32DC74DC18266FD02454AB4F5
                  description:
                    type: string
                    example: Meu Master Roxinho
                  item_type:
                    type: string
                    example: credit_card
                  customer_id:
                    type: string
                    example: 3B926491FC954603B886BC279A769D99
                  data:
                    type: object
                    properties:
