openapi: 3.1.0
info:
  title: conta-de-pagamento-e-marketplace
  version: '1.0'
servers:
- url: https://api.iugu.com/v1
security:
- sec0: []
x-readme-fauxas: true
paths:
  /account/documents:
    get:
      summary: Consultar Envio de Documentos para Verificação de Conta iugu
      description: 'Utilize o `live_ api_token` da subconta.

        Este endpoint permite consultar o status do Envio de Documentos para Verificação de Subconta.'
      operationId: consultar-envio-de-documentos
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  description: '**Filtro de status:** `pending_manual_analysis`, `requested`, `approved`, `processing`, `not_approved`, `rejected`, `expired` ou `invalid`'
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value:
                    items:
                    - kind: identification
                      status: rejected
                      created_at: '2026-09-17T14:26:56-03:00'
                      updated_at: '2026-09-17T14:42:43-03:00'
                      reason: O documento de identificação enviado não é válido. Envie um novo documento.
                      reason_code: CAF-ID-INVALIDO
                Sem pendências:
                  value: "{\n  \"items\": []\n}"
              schema:
                oneOf:
                - type: object
                  properties:
                    items:
                      type: array
                      items:
                        type: object
                        properties:
                          kind:
                            type: string
                            example: selfie
                          status:
                            type: string
                            example: pending_manual_analysis
                          created_at:
                            type: string
                            example: '2024-10-28T12:01:37-03:00'
                          updated_at:
                            type: string
                            example: '2024-10-28T12:01:37-03:00'
                - title: Sem pendências
                  type: object
                  properties:
                    items:
                      type: array
                      items:
                        type: object
                        properties: {}
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Conta Mestre requisitou:
                  value: "{\n  \"errors\": \"Only subaccount are allowed\"\n}"
              schema:
                type: object
                properties:
                  errors:
                    type: string
                    example: Only subaccount are allowed
    put:
      summary: Reenviar Documentos para Verificar Conta iugu
      description: Utilize o `live_ api_token` da subconta. <br><br> Utilize este endpoint quando os Documentos enviados no endpoint `/v1/accounts/{account_id}/request_verification` são reprovados por nosso Time de Prevenção à Fraude.
      operationId: reenviar-documentos
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                files:
                  type: object
                  description: Formatado em `Base64`. Limite de 15 MB por arquivo.
                  properties:
                    identification:
                      type: string
                      description: Documento de Identificação Pessoal do Titular da Conta (frente e verso) — RG, CNH ou Passaporte  <br><br> **RG:** físico ou digital com QR Code <br> **CNH:** físico ou digital com QR Code <br> **Passaporte:** físico ou digital
                      format: binary
                    identification_front:
                      type: string
                      description: Documento de Identificação Pessoal do Titular da Conta **Frente** <br> **Obrigatório** se campo `identification` não for preenchido. <br><br> **RG:** físico ou digital com QR Code <br> **CNH:** físico ou digital com QR Code <br> **Passaporte:** físico ou digital
                      format: binary
                    identification_back:
                      type: string
                      description: Documento de Identificação Pessoal do Titular da Conta **Verso** <br> **Obrigatório** se campo `identification` não for preenchido. <br><br> **RG:** físico ou digital com QR Code <br> **CNH:** físico ou digital com QR Code <br> **Passaporte:** físico ou digital
                      format: binary
                    selfie:
                      type: string
                      description: Selfie (foto) do Titular da Conta — **Importante:** Deve ser tirada pela própria pessoa, sem interferência de terceiros, para garantir autenticidade. <br><br> **CNPJ (`person_type` = `Pessoa Jurídica`):** Representante legal da companhia
                      format: binary
                    address_proof:
                      type: string
                      description: Comprovante de Endereço do Titular da Conta em formato `PDF` ou `JPG` encodado em `Base64`. <br><br>**Importante**<br> O documento deve conter nome, endereço completo, código de barras, valor da fatura e data da emissão.<br><br> **Tipos de Contas**<br>Luz, energia, água, telefone fixou ou celular, internet ou faturas de instituições financeiras dos últimos **90 dias**. <br><br>**CNPJ (`person_type` = `Pessoa Jurídica`):** Envie Comprovante de Endereço da **companhia**.
                      format: binary
                    balance_sheet:
                      type: string
                      description: Relatório Financeiro da Companhia dos últimos **12 meses com a assinatura do representante legal e do contador (deve conter nome e CRC do contador)**. <br><br> **Tipos de Documento**<br> Declaração de que não há Faturamento <br> Declaração de Faturamento simples <br> Relação de Faturamento Pessoa Jurídica <br> Extrato do SIMEI <br> Declaração anual do SIMEI <br> Declaração de Informações Socioeconômicas e Fiscais (DEFIS)
                      format: binary
                    social_contract:
                      type: string
                      description: Contrato Social. **Obrigatório** se `person_type` é `Pessoa Jurídica`.
                      format: binary
                    additional_document_one:
                      type: string
                      description: Documento adicional `1`
                      format: binary
                    additional_document_two:
                      type: string
                      description: Documento adicional `2`
                      format: binary
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n  \"items\": [\n    {\n      \"kind\": \"selfie\",\n      \"status\": \"pending_manual_analysis\",\n      \"created_at\": \"2024-10-28T12:01:37-03:00\",\n      \"updated_at\": \"2024-10-28T12:01:37-03:00\"\n    },\n    {\n      \"kind\": \"identification\",\n      \"status\": \"pending_manual_analysis\",\n      \"created_at\": \"2024-10-28T12:01:37-03:00\",\n      \"updated_at\": \"2024-10-28T12:01:37-03:00\"\n    }\n  ]\n}"
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        kind:
                          type: string
                          example: selfie
                        status:
                          type: string
                          example: pending_manual_analysis
                        created_at:
                          type: string
                          example: '2024-10-28T12:01:37-03:00'
                        updated_at:
                          type: string
                          example: '2024-10-28T12:01:37-03:00'
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value: '{}'
              schema:
                type: object
                properties: {}
      deprecated: false
  /accounts/configuration:
    post:
      summary: Configurar Conta
      description: Configura parâmetros de uma conta de pagamentos.
      operationId: configurar-conta
      parameters:
      - name: Request-Time
        in: header
        description: Timestamp do momento que enviar a requisição de assinatura digital (RSA)
        required: true
        schema:
          type: string
          format: date-time
      - name: Signature
        in: header
        description: Assinatura Digital
        required: true
        schema:
          type: string
          default: signature=
      - in: header
        name: X-Signature-Token-Id
        schema:
          type: string
        description: Indica explicitamente qual token/chave deve ser utilizado na assinatura da requisição, informando o ID do token desejado. Se omitido, mantém o comportamento atual.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                splits:
                  type: array
                  description: Lista de splits que será utilizado nesse conta.
                  items:
                    properties:
                      recipient_account_id:
                        type: string
                        description: ID Da conta que irá receber o split
                      cents:
                        type: integer
                        description: Centavos a serem cobrados.
                        format: int32
                      percent:
                        type: number
                        description: Porcentagem a ser cobrada.
                        format: float
                      bank_slip_cents:
                        type: integer
                        description: Valor em centavos a ser cobrado apenas em transações no boleto.
                        format: int32
                      bank_slip_percent:
                        type: number
                        description: Valor em porcentagem a ser cobrado apenas em transações no boleto.
                        format: float
                      credit_card_cents:
                        type: integer
                        description: Valor em centavos a ser cobrado apenas em transações no cartão de crédito.
                        format: int32
                      credit_card_percent:
                        type: number
                        description: Valor em porcentagem a ser cobrado apenas em transações no cartão de crédito.
                        format: float
                      pix_cents:
