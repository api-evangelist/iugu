                    type: object
                auto_withdraw:
                  type: boolean
                  description: Saque automático?
                auto_withdraw_type:
                  type: string
                  description: 'Periodicidade da agenda: `daily`, `weekly`, `biweekly` ou `monthly`.<br>

                    Quando presente, ativa a agenda. Ausente ou vazio, desativa.'
                auto_withdraw_option:
                  type: integer
                  format: int32
                  description: 'Depende do `auto_withdraw_type`. Para `weekly` e `biweekly`: dia da semana de `1` a `5` (1= Segunda, 2= Terça, 3= Quarta, 4= Quinta, 5= Sexta). Para `monthly`: dia do mês de `1` a `31`. Não se aplica a `daily`.'
                auto_withdraw_anchor_date:
                  type: string
                  description: 'Apenas `biweekly`: data de referência (início do ciclo) que define quais semanas são ativas. (Formato: ''AAAA-MM-DD''). <br> Obrigatória para `biweekly`; ignorada para os demais tipos.'
                per_day_interest:
                  type: boolean
                  description: Juros de mora?
                fines:
                  type: boolean
                  description: Multas?
                late_payment_fine:
                  type: integer
                  description: 'Valor da multa em % (Ex: 2)'
                  format: int32
                auto_advance:
                  type: boolean
                  description: Antecipação Automática. Só pode ser atribuído caso a conta tenha a funcionalidade de Novo Adiantamento habilitado (entre em contato com o Suporte para habilitar). Caso o parâmetro não seja enviado, considera-se a mesma configuração de adiantamento automático da conta mestre.
                auto_advance_type:
                  type: string
                  description: Opções de Antecipação Automática. Obrigatório caso auto_advance seja true. Recebe os valores 'daily' (Antecipação diária), 'weekly' (Antecipação semanal, que ocorre no dia da semana determinado pelo usuário), 'monthly' (Antecipação mensal, que ocorre no dia do mês determinado pelo usuário) e 'days_after_payment' (Antecipação que ocorre em um número de dias após o pagamento especificado pelo usuário)
                auto_advance_option:
                  type: integer
                  description: Obrigatório caso auto_advance seja true e auto_advance_type diferente de 'daily'. Em caso de auto_advance_type = weekly, recebe valores de 0 a 6 (Número correspondente ao dia da semana que a antecipação será realizada, 0 para domingo, 1 para segunda e assim por diante). Em caso de auto_advance_type = monthly, recebe valores de 1 a 28 (Número correspondente ao dia do mês que a antecipação será realizada). Em caso de auto_advance_type = days_after_payment, recebe valores de 1 a 30 (Número de dias após o pagamento em que a antecipação será realizada)
                  format: int32
                bank_slip:
                  type: object
                  description: Configurações de boleto bancário
                  properties:
                    active:
                      type: boolean
                      description: Ativo?
                    extra_due:
                      type: integer
                      description: 'Dias de Vencimento Extras no Boleto (Ex: 2)'
                      format: int32
                    reprint_extra_due:
                      type: integer
                      description: 'Dias de Vencimento Extras na 2a Via do Boleto (Ex: 1)'
                      format: int32
                credit_card:
                  type: object
                  description: Configurações de cartão de crédito
                  properties:
                    active:
                      type: boolean
                      description: Ativo?
                    soft_descriptor:
                      type: string
                      description: 'Descrição que apareça na Fatura do Cartão do Cliente (Obs: Esse campo pode sofrer limitação de 12 ou 22 caracteres dependendo da adquirente utilizada pela iugu no momento da transação, a adquirente não permite a utilização de caracteres especiais)'
                    installments:
                      type: boolean
                      description: Parcelamento ativo?
                    max_installments:
                      type: integer
                      description: Número máximo de parcelas (Nr entre 1 a 18)
                      format: int32
                    max_installments_without_interest:
                      type: integer
                      description: Número de parcelas sem cobrança de juros ao cliente (Nr entre 1 a 18). *somente contas antigas
                      format: int32
                    two_step_transaction:
                      type: boolean
                      description: Habilita o fluxo de pagamento em duas etapas (Autorização e Captura)
                    installments_pass_interest:
                      type: boolean
                      description: Repasse de Juros de Parcelamento ativo? *somente contas antigas
                    two_credit_cards_payment:
                      type: boolean
                      description: '**(NOVO✨)** Ativar/desativar [Pagamento com 2 Cartões](https://dev.iugu.com/docs/cobranca-com-2-cartoes)'
                payment_email_notification:
                  type: boolean
                  description: boolean Ativa ou desativa a notificação de pagamento
                payment_email_notification_receiver:
                  type: string
                  description: Email que deve receber as notificações de pagamento (Obrigatório caso payment_email_notification seja true)
                early_payment_discount:
                  type: boolean
                  description: Ativa ou desativa o desconto por pagamento antecipado
                early_payment_discounts:
                  type: array
                  description: Configuração do desconto a ser aplicado
                  items:
                    properties:
                      days:
                        type: integer
                        description: Dias antecedentes ao vencimento da fatura em que o desconto será aplicado
                        format: int32
                      percent:
                        type: number
                        description: 'Percentual de desconto a ser aplicado. Obs.: O percentual máximo que deve ser aplicado é de 80%.'
                        format: float
                      value_cents:
                        type: integer
                        description: Valor em centavos de desconto a ser aplicado
                        format: int32
                    type: object
                disabled_withdraw:
                  type: boolean
                  description: Desabilita saque da conta
                customer_minimum_balance_cents:
                  type: string
                  description: Configuração de valor para reserva de saque
      responses:
