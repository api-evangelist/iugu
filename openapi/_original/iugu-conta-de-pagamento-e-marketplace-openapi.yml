  /accounts/{id}/request_withdraw:
    post:
      summary: Pedido de Saque/Transferências Próprias
      description: Realiza um pedido de saque de um determinado valor. O valor será enviado para o domicílio bancário da mesma titularidade cadastrado na conta.
      operationId: pedido-de-saque
      parameters:
      - name: id
        in: path
        description: ID da sub-conta
        schema:
          type: string
        required: true
      - name: Request-Time
        in: header
        description: Timestamp do momento que enviar a requisição de assinatura digital (RSA)
        required: true
        schema:
          type: string
          format: date-time
      - name: Signature
        in: header
        description: Assinatura digital validada
        required: true
        schema:
          type: string
          default: signature=
      - in: header
        name: X-Signature-Token-Id
        schema:
          type: string
        description: Indica explicitamente qual token/chave deve ser utilizado na assinatura da requisição, informando o ID do token desejado. Se omitido, mantém o comportamento atual.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                amount:
                  type: number
                  description: 'Valor do Saque (Formato: 500.0 para 500 reais)'
                  format: float
                custom_variables:
                  type: array
                  description: Variáveis personalizadas
                  items:
                    properties:
                      name:
                        type: string
                        description: Nome da variável
                      value:
                        type: string
                        description: Valor da variável
                    type: object
                api_token:
                  type: string
                  description: Chave de API privada
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: "  \"id\": \"9E75E035E9DF4BF18ED7EE6A7AC1DC12\",\n  \"status\": \"accepted\",\n  \"receipt_url\": \"https://comprovantes.iugu.com/9e75e035-e9df-4bf1-8ed7-ee6a7ac1dc12-c0f864\",\n}"
        '401':
          description: '401'
          content:
            application/json:
              examples:
                Only Available On live_mode:
                  value: "{\n  \"errors\": \"Apenas disponível para o ambiente produção\"\n}"
              schema:
                type: object
                properties:
                  errors:
                    type: string
                    example: Apenas disponível para o ambiente produção
  /bank_verification:
    post:
      summary: Adicionar/cadastrar Domicílio Bancário
      description: 'Envia dados para cadastrar ou alterar o domicílio bancário da conta que recebe saques e transferências.


        <div class="magic-block-callout type-danger"><h3><i title="Danger" class="fa fa-exclamation-triangle"></i>Atenção</h3><div class="callout-body"><p>Informe uma conta bancária válida vinculada ao CPF/CNPJ cadastrado na verificação da subconta.</br>Não é possível receber valores em uma conta bancária que tenha um titular diferente do cadastrado na subconta.</p></div></div>'
      operationId: adicionar-domicilio-bancario
      parameters:
      - name: Request-Time
        in: header
        description: Timestamp do momento que enviar a requisição de assinatura digital (RSA)
        required: true
        schema:
          type: string
          format: date-time
      - name: Signature
        in: header
        description: Assinatura digital
        required: true
        schema:
          type: string
          default: signature=
      - in: header
        name: X-Signature-Token-Id
        schema:
          type: string
        description: Indica explicitamente qual token/chave deve ser utilizado na assinatura da requisição, informando o ID do token desejado. Se omitido, mantém o comportamento atual.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - agency
              - account
              - account_type
              - bank
              properties:
                agency:
                  type: string
                  description: Número da agência
                account:
                  type: string
                  description: Número da conta
                account_type:
                  type: string
                  description: Tipo da Conta. **Conta Corrente:** `cc`. **Conta Poupança:** `cp`. **Conta Pagamento:** `cpg`.
                bank:
                  type: string
                  description: Código do Banco (apenas números). **Consulte a tabela acima**.
                automatic_validation:
                  type: boolean
                  description: Valida o dígito verificador da conta
                document:
                  type: string
                  description: Documento de Comprovação dos Dados Bancários (Enviar via multipart ou base64) - (envio opcional)
                  format: binary
                RAW_BODY:
                  type: string
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n    \"success\": true\n}"
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                    default: true
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value: '{}'
              schema:
                type: object
                properties: {}
        '422':
          description: '422'
          content:
            text/plain:
              examples:
                Result:
                  value: "{\n  \"errors\": {\n    \"account_type\": [\n      \"is invalid\"\n    ]\n  }\n}"
              schema:
                type: object
                properties:
                  errors:
                    type: object
                    properties:
                      account_type:
                        type: array
                        items:
                          type: string
                          example: is invalid
    get:
      summary: Verificar envio de domicilio bancário
      description: Consultar dados enviados para alterar domicílio bancário.
      operationId: verificar-envio-de-domicilio-bancario
      responses:
        '200':
          description: '200'
          content:
