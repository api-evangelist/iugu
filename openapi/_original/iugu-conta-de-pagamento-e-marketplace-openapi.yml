    put:
      summary: Editar Subconta
      description: 'Atualiza os parâmetros de uma conta de pagamentos.<div class="magic-block-callout type-warning"><h3><i title="Danger" class="fa fa-exclamation-triangle"></i> IMPORTANTE!</h3><div class="callout-body"><p>Para executar esta chamada é necessário que a conta esteja <a href="https://dev.iugu.com/reference/enviar-verifica%C3%A7%C3%A3o-de-subconta">verificada</a>. Atenção: Para a Autenticação, no lugar do token de API da conta (api_token), deve-se utilizar o token de usuário (user_token), gerado no retorno da <a href="https://dev.iugu.com/reference/criar-subconta">chamada de criação de subconta</a>.'
