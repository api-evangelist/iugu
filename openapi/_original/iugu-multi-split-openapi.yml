  /splits:
    post:
      summary: Criar Splits
      description: Permite a criação de multi splits para uma conta. Criar um novo multi split sobrepõe o que já está configurado. Todas as faturas em aberto em uma conta irão acatar a nova regra de split criada.
      operationId: criar-split-1
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                split_rules:
                  type: array
                  description: Lista de splits a serém aplicado nas faturas pagas
                  items:
                    properties:
                      recipient_account_id:
