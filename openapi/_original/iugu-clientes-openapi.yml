                        cc_emails: {}
                        cpf_cnpj:
                          type: string
                          example: '11343675030'
                        zip_code:
                          type: string
                          example: 13056-344
                        number:
                          type: string
                          example: '60'
                        complement:
                          type: string
                          example: APTO 1702
                        phone:
                          type: string
                          example: '972312345'
                        phone_prefix:
                          type: string
                          example: '11'
                        custom_variables:
                          type: array
                          items:
                            type: object
                            properties:
                              name:
                                type: string
                                example: My-var
                              value:
                                type: string
                                example: var
                        payment_methods:
                          type: array
                          items:
                            type: object
                            properties: {}
                        default_payment_method_id: {}
                        proxy_payments_from_customer_id: {}
                        city:
                          type: string
                          example: Campinas
                        state:
                          type: string
                          example: SP
                        district:
                          type: string
                          example: Dic I (Conjunto Habitacional Monsenhor Luiz Fernando Abreu)
                        street:
                          type: string
                          example: Rua Antônio Nunes
                  totalItems:
                    type: integer
                    example: 57
                    default: 0
