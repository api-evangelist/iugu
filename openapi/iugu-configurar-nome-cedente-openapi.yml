paths:
  /transferors:
    post:
      summary: Inserir Dados do Cedente
      description: Insere os dados do cedente ou beneficiário, que é o responsável por receber o pagamento e também emitir a cobrança. Essas informações serão apresentadas na fatura. Em caso de boleto bancário, o nome do Beneficiário será o nome da Conta Mestre.
      operationId: inserir-dados-cedente
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - name
              - street
              - zip_code
              - state
              - number
              - city
              properties:
                name:
                  type: string
                  description: Nome
                street:
                  type: string
                  description: Rua
                zip_code:
                  type: string
                  description: CEP
                state:
                  type: string
                  description: 'Estado (Ex.: SP)'
                number:
                  type: string
                  description: Número
                city:
                  type: string
                  description: Cidade
                district:
                  type: string
                  description: Bairro
                complement:
                  type: string
                  description: Complemento
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n   \"account_informations\": [\n       {\n           \"key\": \"bank_slip_transferor_street\",\n           \"value\": \"Av. Paulista\"\n       },\n       {\n           \"key\": \"bank_slip_transferor_zip_code\",\n           \"value\": \"01310-100\"\n       },\n       {\n           \"key\": \"bank_slip_transferor_district\",\n           \"value\": \"Bela Vista\"\n       },\n       {\n           \"key\": \"bank_slip_transferor_state\",\n           \"value\": \"SP\"\n       },\n       {\n           \"key\": \"bank_slip_transferor_complement\",\n           \"value\": \"Quinto andar\"\n       },\n       {\n           \"key\": \"bank_slip_transferor_number\",\n           \"value\": \"1048\"\n       },\n       {\n           \"key\": \"bank_slip_transferor_name\",\n           \"value\": \"iugu Serviços na Internet S/A\"\n       },\n       {\n           \"key\": \"bank_slip_transferor_city\",\n           \"value\": \"São Paulo\"\n       }\n   ]\n}"
              schema:
                type: object
                properties:
                  account_informations:
                    type: array
                    items:
                      type: object
                      properties:
                        key:
                          type: string
                          example: bank_slip_transferor_street
                        value:
                          type: string
                          example: Av. Paulista
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value: '{}'
              schema:
                type: object
                properties: {}
      deprecated: false
