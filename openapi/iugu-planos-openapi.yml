  /plans/{id}:
    put:
      summary: Editar Plano
      description: Altera os dados de um Plano, quaisquer parâmetros não informados não serão alterados. As alterações não irão mudar as Assinaturas que já utilizam o Plano, mas só as novas.
      operationId: alterar-plano
      parameters:
      - name: id
        in: path
        description: ID do plano
        schema:
          type: string
        required: true
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: Nome do plano
                interval:
                  type: integer
                  description: Ciclo do plano (Número inteiro maior que 0)
                  format: int32
                interval_type:
                  type: string
                  description: Tipo de interval ("weeks" ou "months")
                value_cents:
                  type: integer
                  description: Preço do plano em centavos
                  format: int32
                payable_with:
                  type: array
                  description: Método de pagamento que será disponibilizado para as faturas pertencentes a assinaturas deste plano ('all','pix', 'credit_card' ou 'bank_slip')
                  items:
                    type: string
                features:
                  type: array
                  description: Descrição das funcionalidades do plano, permite adicionar, alterar ou remover. Para remover, envie "id:$valor" + "_destroy:true" sendo $valor o ID da feature.
                  items:
                    properties:
                      id:
                        type: string
                        description: ID único da funcionalidade "chave para remoção"
                      _destroy:
                        type: boolean
                        description: '"true" ou "false"'
                      value:
                        type: integer
                        description: Valor da funcionalidade (número maior que 0)
                        format: int32
                      name:
                        type: string
                        description: Nome da funcionalidade
                    type: object
                billing_days:
                  type: integer
                  description: Dias de faturamento (Quantos dias antes de vencer a assinatura será gerada uma nova fatura)
                  format: int32
                max_cycles:
                  type: integer
                  description: Limite de ciclos - 0 para indeterminado
                  format: int32
                invoice_max_installments:
                  type: integer
                  description: Envie um valor de '1' à '12'. Se este parâmetro não for enviado, a quantidade máxima de parcelas será o que está configurado na conta.
                  format: int32
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n  \"id\": \"CA1D0620A8434B2CABFF951A72EA70D6\",\n  \"name\": \"Plano Master\",\n  \"identifier\": \"master_plan\",\n  \"interval\": 1,\n  \"interval_type\": \"months\",\n  \"created_at\": \"2025-04-03T11:51:28-03:00\",\n  \"updated_at\": \"2025-04-03T11:51:28-03:00\",\n  \"prices\": [\n    {\n      \"id\": \"E11DC66A12414F2DB1EC78A9FDEF0C55\",\n      \"currency\": \"BRL\",\n      \"value_cents\": 1,\n      \"plan_id\": \"CA1D0620A8434B2CABFF951A72EA70D6\",\n      \"created_at\": \"2025-04-03T11:51:28-03:00\",\n      \"updated_at\": \"2025-04-03T11:51:28-03:00\"\n    }\n  ],\n  \"features\": [\n    {\n      \"id\": \"1610B2CBF9504CA5BAD1FEB328953A3B\",\n      \"name\": \"2 aulas individuais por semana\",\n      \"identifier\": \"2_classes_per_week\",\n      \"value\": 1,\n      \"important\": null,\n      \"plan_id\": \"CA1D0620A8434B2CABFF951A72EA70D6\",\n      \"position\": 1,\n      \"created_at\": \"2025-04-03T11:51:28-03:00\",\n      \"updated_at\": \"2025-04-03T11:51:28-03:00\"\
                    \n    },\n    {\n      \"id\": \"9AE7E78D5AB94E6996AD519BB476940F\",\n      \"name\": \"Acesso VIP\",\n      \"identifier\": \"vip_access\",\n      \"value\": 1,\n      \"important\": null,\n      \"plan_id\": \"CA1D0620A8434B2CABFF951A72EA70D6\",\n      \"position\": 1,\n      \"created_at\": \"2025-04-03T11:51:28-03:00\",\n      \"updated_at\": \"2025-04-03T11:51:28-03:00\"\n    }\n  ],\n  \"payable_with\": [\n    \"pix\",\n    \"credit_card\",\n    \"bank_slip\"\n  ],\n  \"max_cycles\": 0,\n  \"billing_days\": 5,\n  \"invoice_max_installments\": null\n}"
              schema:
                type: object
                properties:
                  id:
                    type: string
                    example: CA1D0620A8434B2CABFF951A72EA70D6
                  name:
                    type: string
                    example: Plano Master
                  identifier:
                    type: string
                    example: master_plan
                  interval:
                    type: integer
                    example: 1
                    default: 0
                  interval_type:
                    type: string
                    example: months
                  created_at:
                    type: string
                    example: '2025-04-03T11:51:28-03:00'
                  updated_at:
                    type: string
                    example: '2025-04-03T11:51:28-03:00'
                  prices:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          example: E11DC66A12414F2DB1EC78A9FDEF0C55
                        currency:
                          type: string
                          example: BRL
                        value_cents:
                          type: integer
                          example: 1
                          default: 0
                        plan_id:
                          type: string
                          example: CA1D0620A8434B2CABFF951A72EA70D6
