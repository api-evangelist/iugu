openapi: 3.1.0
info:
  title: planos
  version: '1.0'
servers:
- url: https://api.iugu.com/v1
security:
- sec0: []
x-readme-fauxas: true
paths:
  /plans:
    post:
      summary: Criar Plano
      description: Cria um plano.
      operationId: criar-plano
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - name
              - identifier
              - interval
              - interval_type
              - value_cents
              properties:
                name:
                  type: string
                  description: Nome do plano
                identifier:
                  type: string
                  description: Identificador do plano
                interval:
                  type: integer
                  description: Ciclo do plano (Entre 1 e 599). Intervalo até a próxima cobrança.
                  format: int32
                interval_type:
                  type: string
                  description: Tipo de interval ("weeks" ou "months").
                value_cents:
                  type: integer
                  description: Preço do plano em centavos
                  format: int32
                payable_with:
                  type: array
                  description: Método de pagamento que será disponibilizado para as faturas pertencentes a assinaturas deste plano ('all', 'credit_card', 'bank_slip' ou 'pix')
                  items:
                    type: string
                features:
                  type: array
                  items:
                    properties:
                      name:
                        type: string
                        description: Nome da funcionalidade
                      identifier:
                        type: string
                        description: Identificador único da funcionalidade
                      value:
                        type: integer
                        description: Valor da funcionalidade (número maior que 0)
                        format: int32
                    required:
                    - name
                    - identifier
                    - value
                    type: object
                billing_days:
                  type: integer
                  description: Dias de faturamento (Quantos dias antes de vencer a assinatura será gerada uma nova fatura)
                  format: int32
                max_cycles:
                  type: integer
                  description: Limite de ciclos da assinatura - 0 para indeterminado
                  format: int32
                invoice_max_installments:
                  type: integer
                  description: Envie um valor de '1' à '12'. Se este parâmetro não for enviado, a quantidade máxima de parcelas será o que está configurado na conta.
                  format: int32
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n  \"id\": \"CA1D0620A8434B2CABFF951A72EA70D6\",\n  \"name\": \"Plano Master\",\n  \"identifier\": \"master_plan\",\n  \"interval\": 1,\n  \"interval_type\": \"months\",\n  \"created_at\": \"2025-04-03T11:51:28-03:00\",\n  \"updated_at\": \"2025-04-03T11:51:28-03:00\",\n  \"prices\": [\n    {\n      \"id\": \"E11DC66A12414F2DB1EC78A9FDEF0C55\",\n      \"currency\": \"BRL\",\n      \"value_cents\": 1,\n      \"plan_id\": \"CA1D0620A8434B2CABFF951A72EA70D6\",\n      \"created_at\": \"2025-04-03T11:51:28-03:00\",\n      \"updated_at\": \"2025-04-03T11:51:28-03:00\"\n    }\n  ],\n  \"features\": [\n    {\n      \"id\": \"1610B2CBF9504CA5BAD1FEB328953A3B\",\n      \"name\": \"2 aulas individuais por semana\",\n      \"identifier\": \"2_classes_per_week\",\n      \"value\": 1,\n      \"important\": null,\n      \"plan_id\": \"CA1D0620A8434B2CABFF951A72EA70D6\",\n      \"position\": 1,\n      \"created_at\": \"2025-04-03T11:51:28-03:00\",\n      \"updated_at\": \"2025-04-03T11:51:28-03:00\"\
                    \n    },\n    {\n      \"id\": \"9AE7E78D5AB94E6996AD519BB476940F\",\n      \"name\": \"Acesso VIP\",\n      \"identifier\": \"vip_access\",\n      \"value\": 1,\n      \"important\": null,\n      \"plan_id\": \"CA1D0620A8434B2CABFF951A72EA70D6\",\n      \"position\": 1,\n      \"created_at\": \"2025-04-03T11:51:28-03:00\",\n      \"updated_at\": \"2025-04-03T11:51:28-03:00\"\n    }\n  ],\n  \"payable_with\": [\n    \"pix\",\n    \"credit_card\",\n    \"bank_slip\"\n  ],\n  \"max_cycles\": 0,\n  \"billing_days\": 5,\n  \"invoice_max_installments\": null\n}"
              schema:
                type: object
                properties:
                  id:
                    type: string
                    example: CA1D0620A8434B2CABFF951A72EA70D6
                  name:
                    type: string
                    example: Plano Master
                  identifier:
                    type: string
                    example: master_plan
                  interval:
                    type: integer
                    example: 1
                    default: 0
                  interval_type:
                    type: string
                    example: months
                  created_at:
                    type: string
                    example: '2025-04-03T11:51:28-03:00'
                  updated_at:
                    type: string
                    example: '2025-04-03T11:51:28-03:00'
                  prices:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          example: E11DC66A12414F2DB1EC78A9FDEF0C55
                        currency:
                          type: string
                          example: BRL
                        value_cents:
                          type: integer
                          example: 1
                          default: 0
                        plan_id:
                          type: string
                          example: CA1D0620A8434B2CABFF951A72EA70D6
                        created_at:
                          type: string
                          example: '2025-04-03T11:51:28-03:00'
                        updated_at:
                          type: string
                          example: '2025-04-03T11:51:28-03:00'
                  features:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          example: 1610B2CBF9504CA5BAD1FEB328953A3B
                        name:
                          type: string
                          example: 2 aulas individuais por semana
                        identifier:
                          type: string
                          example: 2_classes_per_week
                        value:
                          type: integer
                          example: 1
                          default: 0
                        important: {}
                        plan_id:
                          type: string
                          example: CA1D0620A8434B2CABFF951A72EA70D6
                        position:
                          type: integer
                          example: 1
                          default: 0
                        created_at:
                          type: string
                          example: '2025-04-03T11:51:28-03:00'
                        updated_at:
                          type: string
                          example: '2025-04-03T11:51:28-03:00'
                  payable_with:
                    type: array
                    items:
                      type: string
                      example: pix
                  max_cycles:
                    type: integer
                    example: 0
                    default: 0
                  billing_days:
                    type: integer
                    example: 5
                    default: 0
                  invoice_max_installments: {}
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value: '{}'
              schema:
                type: object
                properties: {}
      deprecated: false
    get:
      summary: Listar Planos
      description: 'Retorna uma lista com todos os planos da sua conta, ordenada pela data de criação, exibindo primeiro o plano criado mais recentemente. <br><br> :warning: **Importante:** O parâmetro `totalItems` retornado após a consulta indica a quantidade total de planos cadastrados. No entanto, ele somente é incluído na resposta quando uma **query** é fornecida. </br></br>'
      operationId: listar-plano
      parameters:
      - name: limit
        in: query
        description: Limita em até 1.000 o número de registros listados. Caso não seja enviado, aplica-se o limite padrão de 100 registros
        schema:
          type: integer
          format: int32
      - name: start
        in: query
        description: Quantos registros pular do início da pesquisa (muito utilizado para paginação)
        schema:
          type: integer
          format: int32
      - name: query
        in: query
        description: Neste parâmetro pode ser passado um texto para pesquisa. Quando utilizado, deve-se aplicar paginação (limit, start, etc).
        schema:
          type: string
      - name: updated_since
        in: query
        description: Registros atualizados desde o valor passado no parâmetro
        schema:
          type: string
          format: date
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n  \"items\": [\n    {\n      \"id\": \"CA1D0620A8434B2CABFF951A72EA70D6\",\n      \"name\": \"Plano Master\",\n      \"identifier\": \"master_plan\",\n      \"interval\": 1,\n      \"interval_type\": \"months\",\n      \"created_at\": \"2025-04-03T11:51:28-03:00\",\n      \"updated_at\": \"2025-04-03T11:51:28-03:00\",\n      \"prices\": [\n        {\n          \"id\": \"E11DC66A12414F2DB1EC78A9FDEF0C55\",\n          \"currency\": \"BRL\",\n          \"value_cents\": 1,\n          \"created_at\": \"2025-04-03T11:51:28-03:00\",\n          \"updated_at\": \"2025-04-03T11:51:28-03:00\"\n        }\n      ],\n      \"features\": [\n        {\n          \"id\": \"1610B2CBF9504CA5BAD1FEB328953A3B\",\n          \"name\": \"2 aulas individuais por semana\",\n          \"identifier\": \"2_classes_per_week\",\n          \"value\": 1,\n          \"important\": null,\n          \"position\": 1,\n          \"created_at\": \"2025-04-03T11:51:28-03:00\",\n          \"updated_at\"\
                    : \"2025-04-03T11:51:28-03:00\"\n        },\n        {\n          \"id\": \"9AE7E78D5AB94E6996AD519BB476940F\",\n          \"name\": \"Acesso VIP\",\n          \"identifier\": \"vip_access\",\n          \"value\": 1,\n          \"important\": null,\n          \"position\": 1,\n          \"created_at\": \"2025-04-03T11:51:28-03:00\",\n          \"updated_at\": \"2025-04-03T11:51:28-03:00\"\n        }\n      ],\n      \"payable_with\": [\n        \"pix\",\n        \"credit_card\",\n        \"bank_slip\"\n      ],\n      \"max_cycles\": 0,\n      \"billing_days\": 5,\n      \"invoice_max_installments\": null\n    },\n    {\n      \"id\": \"BEC4B131D09146499178C1383652024A\",\n      \"name\": \"Plano Básico\",\n      \"identifier\": \"basic_plan\",\n      \"interval\": 1,\n      \"interval_type\": \"months\",\n      \"created_at\": \"2025-04-03T11:49:40-03:00\",\n      \"updated_at\": \"2025-04-03T11:49:40-03:00\",\n      \"prices\": [\n        {\n          \"id\": \"06AC8373C4714B6BB2B66EE51900A430\"\
                    ,\n          \"currency\": \"BRL\",\n          \"value_cents\": 1,\n          \"created_at\": \"2025-04-03T11:49:40-03:00\",\n          \"updated_at\": \"2025-04-03T11:49:40-03:00\"\n        }\n      ],\n      \"features\": [],\n      \"payable_with\": [\n        \"pix\",\n        \"credit_card\",\n        \"bank_slip\"\n      ],\n      \"max_cycles\": 0,\n      \"billing_days\": 5,\n      \"invoice_max_installments\": 4\n    }\n  ],\n  \"totalItems\": 15\n}"
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          example: CA1D0620A8434B2CABFF951A72EA70D6
                        name:
                          type: string
                          example: Plano Master
                        identifier:
                          type: string
                          example: master_plan
                        interval:
                          type: integer
                          example: 1
                          default: 0
                        interval_type:
                          type: string
                          example: months
                        created_at:
                          type: string
                          example: '2025-04-03T11:51:28-03:00'
                        updated_at:
                          type: string
                          example: '2025-04-03T11:51:28-03:00'
                        prices:
                          type: array
                          items:
                            type: object
                            properties:
                              id:
                                type: string
                                example: E11DC66A12414F2DB1EC78A9FDEF0C55
                              currency:
                                type: string
                                example: BRL
                              value_cents:
                                type: integer
                                example: 1
                                default: 0
                              created_at:
                                type: string
                                example: '2025-04-03T11:51:28-03:00'
                              updated_at:
                                type: string
                                example: '2025-04-03T11:51:28-03:00'
                        features:
                          type: array
                          items:
                            type: object
                            properties:
                              id:
                                type: string
                                example: 1610B2CBF9504CA5BAD1FEB328953A3B
                              name:
                                type: string
                                example: 2 aulas individuais por semana
                              identifier:
                                type: string
                                example: 2_classes_per_week
                              value:
                                type: integer
                                example: 1
                                default: 0
                              important: {}
                              position:
                                type: integer
                                example: 1
                                default: 0
                              created_at:
                                type: string
                                example: '2025-04-03T11:51:28-03:00'
                              updated_at:
                                type: string
                                example: '2025-04-03T11:51:28-03:00'
                        payable_with:
                          type: array
                          items:
                            type: string
                            example: pix
                        max_cycles:
                          type: integer
                          example: 0
                          default: 0
                        billing_days:
                          type: integer
                          example: 5
                          default: 0
                        invoice_max_installments: {}
                  totalItems:
                    type: integer
                    example: 15
                    default: 0
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value: '{}'
              schema:
                type: object
                properties: {}
      deprecated: false
  /plans/identifier/{identifier}:
    get:
      summary: Buscar Plano pelo Identificador
      description: Retorna os dados de um plano utilizando um identificador.
      operationId: buscar-plano-pelo-identificador
      parameters:
      - name: identifier
        in: path
        description: Identificador do plano
        schema:
          type: string
        required: true
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n  \"id\": \"CA1D0620A8434B2CABFF951A72EA70D6\",\n  \"name\": \"Plano Master\",\n  \"identifier\": \"master_plan\",\n  \"interval\": 1,\n  \"interval_type\": \"months\",\n  \"created_at\": \"2025-04-03T11:51:28-03:00\",\n  \"updated_at\": \"2025-04-03T11:51:28-03:00\",\n  \"prices\": [\n    {\n      \"id\": \"E11DC66A12414F2DB1EC78A9FDEF0C55\",\n      \"currency\": \"BRL\",\n      \"value_cents\": 1,\n      \"plan_id\": \"CA1D0620A8434B2CABFF951A72EA70D6\",\n      \"created_at\": \"2025-04-03T11:51:28-03:00\",\n      \"updated_at\": \"2025-04-03T11:51:28-03:00\"\n    }\n  ],\n  \"features\": [\n    {\n      \"id\": \"1610B2CBF9504CA5BAD1FEB328953A3B\",\n      \"name\": \"2 aulas individuais por semana\",\n      \"identifier\": \"2_classes_per_week\",\n      \"value\": 1,\n      \"important\": null,\n      \"plan_id\": \"CA1D0620A8434B2CABFF951A72EA70D6\",\n      \"position\": 1,\n      \"created_at\": \"2025-04-03T11:51:28-03:00\",\n      \"updated_at\": \"2025-04-03T11:51:28-03:00\"\
