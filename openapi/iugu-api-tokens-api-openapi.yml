openapi: 3.2.0
info:
  title: Iugu Api Tokens API
  version: '1.0'
  description: 'Operations tagged Api Tokens across 2 of this provider''s published API definitions: iugu-tokens-e-cobran-a-direta-openapi.yml, iugu-tokens-de-api-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.iugu.com/v1
security:
- sec0: []
tags:
- name: API Tokens
paths:
  /{account_id}/api_tokens:
    get:
      summary: Listar API Tokens
      description: 'Lista os "api_tokens" de uma conta.


        Atenção


        Essa API obriga a utilização do **>** da conta mestre na autenticação da chamada.'
      operationId: listar-api-tokens
      parameters:
      - name: Request-Time
        in: header
        description: Timestamp do momento que enviar a requisição de assinatura digital (RSA)
        required: true
        schema:
          type: string
          format: date-time
      - name: Signature
        in: header
        description: Assinatura digital
        required: true
        schema:
          type: string
          default: signature=
      - name: account_id
        in: path
        description: ID da Conta que deseja consultar
        schema:
          type: string
        required: true
      - in: header
        name: X-Signature-Token-Id
        schema:
          type: string
        description: Indica explicitamente qual token/chave deve ser utilizado na assinatura da requisição, informando o ID do token desejado. Se omitido, mantém o comportamento atual.
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: "[\n  {\n    \"id\": \"3F8B2C71D04E4A9B8E6C15A7F9D20B43\",\n    \"token\": \"7C2A91********************\",\n    \"api_type\": \"LIVE\",\n    \"description\": \"integracao prod\",\n    \"created_at\": \"2024-03-18T14:22:07-03:00\",\n    \"status\": \"active\"\n  },\n  {\n    \"id\": \"8D65A2F0E91B47C3B2F4A6C8D0E13579\",\n    \"token\": \"5A9F6E********************\",\n    \"api_type\": \"TEST\",\n    \"description\": \"integracao test\",\n    \"created_at\": \"2024-03-18T14:22:07-03:00\",\n    \"status\": \"active\"\n  }"
              schema:
                type: object
                properties:
                  referrer_id:
                    type: string
                    example: 27016E1AD888499A98994E781B6C3762
                  accounts:
                    type: object
                    properties:
