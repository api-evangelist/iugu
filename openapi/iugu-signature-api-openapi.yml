openapi: 3.2.0
info:
  title: faturas Signature API
  version: '1.0'
servers:
- url: https://api.iugu.com/v1
security:
- sec0: []
tags:
- name: Signature
paths:
  /signature/validate:
    post:
      summary: Validate Signature
      description: 'Valida uma assinatura digital para ser utilizada. A assinatura é um pré-requisito de algumas requisições na iugu.


        Atenção


        Para saber como gerar uma assinatura, acesse nossa FAQ de (Autenticação).'
      operationId: validate-signature
      parameters:
      - name: Signature
        in: header
        description: signature=`<assinatura gerada pela sua chave privada>`
        schema:
          type: string
          default: signature=<assinatura gerada pela sua chave privada>
      - name: Request-Time
        in: header
        description: O padrão deve ser ISO 8601
        schema:
          type: string
          format: date-time
      - in: header
        name: X-Signature-Token-Id
        schema:
          type: string
        description: Indica explicitamente qual token/chave deve ser utilizado na assinatura da requisição, informando o ID do token desejado. Se omitido, mantém o comportamento atual.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                RAW_BODY:
                  type: string
                  description: 'Mensagem raw para teste ( ex: "{teste: da assinatura}")'
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: '{"message":"Signature check successful","request_body":"{\n  \"api_token\":\"767F3F9A59B7BD29F48845A024C8F1001525C773106BAB7527A9C87236839\",\n  \"message\":\"anything\"\n}","status":"ok"}'
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Signature check successful
                  request_body:
                    type: string
                    example: "{\n  \"api_token\":\"767F3F9A59B7BD29F48845A024C8F1001525C773106BAB7527A9C87236839\",\n  \"message\":\"anything\"\n}"
                  status:
                    type: string
                    example: ok
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value: '{}'
              schema:
                type: object
                properties: {}
      x-readme:
        code-samples:
        - language: ruby
          code: 'require ''uri''

            require ''net/http''

            require ''openssl''


            url = URI("https://api.iugu.com/v1/signature/validate")


            http = Net::HTTP.new(url.host, url.port)

            http.use_ssl = true

            http.verify_mode = OpenSSL::SSL::VERIFY_NONE


            request = Net::HTTP::Post.new(url)

            request["Content-Type"] = ''application/json''

            request["Signature"] = ''''

            request["Request-Time"] = ''2022-06-09T16:31:28-03:00''

            request.body = "{\n  \"api_token\":\"767F3F9A59B7BD29F489E3845A024C8F1001525C773106BAB7527A9C87236839\",\n  \"message\":\"anything\"\n}"


            response = http.request(request)

            puts response.read_body'
        samples-languages:
        - ruby
      tags:
      - Signature
components:
  securitySchemes:
    sec0:
      type: apiKey
      name: api_token
      in: query
