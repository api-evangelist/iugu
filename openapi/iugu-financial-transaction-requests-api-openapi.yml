paths:
  /financial_transaction_requests:
    get:
      summary: Listar Recebíveis
      description: Lista Recebíveis de uma conta
      operationId: listar-recebiveis
      parameters:
      - name: limit
        in: query
        description: Quantidade de recebíveis retornadas (recomendamos usar no máximo limit=100)
        schema:
          type: integer
          format: int32
      - name: start
        in: query
        description: Quantos registros pular do início da pesquisa, usado para paginação (verificar modo de uso em [Paginação](https://dev.iugu.com/reference/pagina%C3%A7%C3%A3o))
        schema:
          type: integer
          format: int32
      - name: status_filter
        in: query
        description: Lista recebíveis filtrando por status (`pending`, `done` ou `canceled`)
        schema:
          type: string
      - name: since[year]
        in: query
        description: Filtrar registros a partir de determinado ano
        schema:
          type: integer
          format: int32
      - name: since[month]
        in: query
        description: Filtrar registros a partir de determinado mês
        schema:
          type: integer
          format: int32
      - name: since[day]
        in: query
        description: Filtrar registros a partir de determinado dia
        schema:
          type: integer
          format: int32
      - name: to[year]
        in: query
        description: Filtrar registros até determinado ano
        schema:
          type: integer
          format: int32
      - name: to[month]
        in: query
        description: Filtrar registros até determinado mês
        schema:
          type: integer
          format: int32
      - name: to[day]
        in: query
        description: Filtrar registros até determinado dia
        schema:
          type: integer
          format: int32
