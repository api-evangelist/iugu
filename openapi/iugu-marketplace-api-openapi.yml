openapi: 3.2.0
info:
  title: Iugu Marketplace API
  version: '1.0'
  description: 'Operations tagged Marketplace across 2 of this provider''s published API definitions: iugu-baas-openapi.yml, iugu-conta-de-pagamento-e-marketplace-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.iugu.com/v1
security:
- sec0: []
tags:
- name: Marketplace
paths:
  /marketplace/create_account:
    post:
      summary: Criar Conta
      description: 'Utilize o `live_api_token` da Conta Mestre.


        Para planos que têm o recurso Marketplace. Permite a criação de contas bancárias iugu Para mais informações sobre como configurar um subconta.'
      operationId: baas-criar-conta
      parameters:
      - name: Request-Time
        in: header
        description: Timestamp do momento que enviar a requisição de assinatura digital (RSA)
        required: true
        schema:
          type: string
          format: date-time
      - name: Signature
        in: header
        description: Assinatura digital
        required: true
        schema:
          type: string
          default: signature=
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: Nome da Conta — **Não insira números nem caracteres especiais**.
                splits:
                  type: array
                  description: Regra de Split que será utilizado para **todas as faturas** criadas por esta conta. <br> Se utilizado [Split por Fatura](https://dev.iugu.com/docs/split-de-pagamentos#split-por-fatura-split-vari%C3%A1vel), esta configuração será desconsiderada.
                  items:
                    properties:
                      recipient_account_id:
                        type: string
                        description: ID da conta que receberá o split.
                      cents:
                        type: integer
                        description: Centavos a serem cobrados.
                        format: int32
                      percent:
                        type: number
                        description: Porcentagem do valor **total** da fatura a ser dividido para o `recepient_account_id`.
                        format: float
                      bank_slip_cents:
                        type: integer
                        description: Valor a ser dividido se a fatura for paga por **Boleto Bancário** — `bank_slip`.
                        format: int32
                      bank_slip_percent:
                        type: number
                        description: Percentual do valor total da fatura a ser dividido se for paga por **Boleto Bancário** — `bank_slip`.
                        format: float
                      credit_card_cents:
                        type: integer
                        description: Valor a ser dividido se a fatura for paga por **Cartão de Crédito** — `credit_card`.
                        format: int32
                      credit_card_percent:
                        type: number
                        description: Percentual do valor total da fatura a ser dividido se for paga por **Cartão de Crédito** — `credit_card`.
                        format: float
                      pix_cents:
                        type: integer
                        description: Valor a ser dividido se a fatura for paga por **PIX** — `pix`.
                        format: int32
                      pix_percent:
                        type: number
                        description: Percentual do valor total da fatura a ser dividido se for paga por **PIX** — `pix`.
                        format: float
                      permit_aggregated:
                        type: boolean
                        description: Se `true`, permite utilizar Splits tanto do tipo `percent` quanto `cents`.
                      credit_card_1x_cents:
                        type: integer
                        description: Valor a ser dividido se a fatura for paga em `1x` (à vista) no Cartão de Crédito.
                        format: int32
                      credit_card_2x_cents:
                        type: integer
                        description: Valor a ser dividido se a fatura for paga em `2x` no Cartão de Crédito.
                        format: int32
                      credit_card_3x_cents:
                        type: integer
                        description: Valor a ser dividido se a fatura for paga em `3x` no Cartão de Crédito.
                        format: int32
                      credit_card_4x_cents:
                        type: integer
                        description: Valor a ser dividido se a fatura for paga em `4x` no Cartão de Crédito.
                        format: int32
                      credit_card_5x_cents:
                        type: integer
                        description: Valor a ser dividido se a fatura for paga em `5x` no Cartão de Crédito.
                        format: int32
                      credit_card_6x_cents:
                        type: integer
                        description: Valor a ser dividido se a fatura for paga em `6x` no Cartão de Crédito.
                        format: int32
                      credit_card_7x_cents:
                        type: integer
                        description: Valor a ser dividido se a fatura for paga em `7x` no Cartão de Crédito.
                        format: int32
                      credit_card_8x_cents:
                        type: integer
                        description: Valor a ser dividido se a fatura for paga em `8x` no Cartão de Crédito.
                        format: int32
                      credit_card_9x_cents:
                        type: integer
                        description: Valor a ser dividido se a fatura for paga em `9x` no Cartão de Crédito.
                        format: int32
                      credit_card_10x_cents:
                        type: integer
                        description: Valor a ser dividido se a fatura for paga em `10x` no Cartão de Crédito.
                        format: int32
                      credit_card_11x_cents:
                        type: integer
                        description: Valor a ser dividido se a fatura for paga em `11x` no Cartão de Crédito.
                        format: int32
                      credit_card_12x_cents:
                        type: integer
                        description: Valor a ser dividido se a fatura for paga em `12x` no Cartão de Crédito.
                        format: int32
                      credit_card_1x_percent:
                        type: number
                        description: Percentual do valor total da fatura a ser dividido se for paga em `1x` (à vista) no Cartão de Crédito.
                        format: float
                      credit_card_2x_percent:
                        type: number
                        description: Percentual do valor total da fatura a ser dividido se for paga em `2x` no Cartão de Crédito.
                        format: float
                      credit_card_3x_percent:
                        type: number
                        description: Percentual do valor total da fatura a ser dividido se for paga em `3x` no Cartão de Crédito.
                        format: float
                      credit_card_4x_percent:
                        type: number
                        description: Percentual do valor total da fatura a ser dividido se for paga em `4x` no Cartão de Crédito.
                        format: float
                      credit_card_5x_percent:
                        type: number
                        description: Percentual do valor total da fatura a ser dividido se for paga em `5x` no Cartão de Crédito.
                        format: float
                      credit_card_6x_percent:
                        type: number
                        description: Percentual do valor total da fatura a ser dividido se for paga em `6x` no Cartão de Crédito.
                        format: float
                      credit_card_7x_percent:
                        type: number
                        description: Percentual do valor total da fatura a ser dividido se for paga em `7x` no Cartão de Crédito.
                        format: float
                      credit_card_8x_percent:
                        type: number
                        description: Percentual do valor total da fatura a ser dividido se for paga em `8x` no Cartão de Crédito.
                        format: float
                      credit_card_9x_percent:
                        type: number
                        description: Percentual do valor total da fatura a ser dividido se for paga em `9x` no Cartão de Crédito.
                        format: float
                      credit_card_10x_percent:
                        type: number
                        description: Percentual do valor total da fatura a ser dividido se for paga em `10x` no Cartão de Crédito.
                        format: float
                      credit_card_11x_percent:
                        type: number
                        description: Percentual do valor total da fatura a ser dividido se for paga em `11x` no Cartão de Crédito.
                        format: float
                      credit_card_12x_percent:
                        type: number
                        description: Percentual do valor total da fatura a ser dividido se for paga em `12x` no Cartão de Crédito.
                        format: float
                    type: object
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n    \"account_id\": \"49196DF60BC64B6EB42DEC9C5D81C2CC\",\n    \"name\": \"Subconta\",\n    \"live_api_token\": \"AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA111111111111111111111111111111111\",\n    \"test_api_token\": \"AAAAAAAAAAAAAAAAAAAAAA111111111111111111111111111111111AAAAAAAAA\",\n    \"user_token\": \"111111111111111111111111111111111AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA\"\n}"
              schema:
                type: object
                properties:
                  account_id:
                    type: string
                    example: 49196DF60BC64B6EB42DEC9C5D81C2CC
                  name:
                    type: string
                    example: Subconta
                  live_api_token:
                    type: string
                    example: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA111111111111111111111111111111111
                  test_api_token:
                    type: string
                    example: AAAAAAAAAAAAAAAAAAAAAA111111111111111111111111111111111AAAAAAAAA
                  user_token:
                    type: string
                    example: 111111111111111111111111111111111AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value: '{}'
              schema:
                type: object
                properties: {}
      deprecated: false
      tags:
      - Marketplace
    servers:
    - url: https://api.iugu.com/v1
  /marketplace/deactivate:
    post:
      summary: Desativar Conta iugu
      description: 'Utilize o `live_api_token` da subconta.


        Desative uma conta a partir do seu ID. Certifique-se que a conta **não tem saldo**.'
      operationId: desativar-subconta-copy
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - account_id
              properties:
                account_id:
                  type: string
                  description: ID da Subconta que será desativada.
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n  \"success\": true,\n  \"message\": \"A conta está em processo de desativação, em alguns instantes será finalizado.\"\n}"
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                    default: true
                  message:
                    type: string
                    example: A conta está em processo de desativação, em alguns instantes será finalizado.
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value: '{}'
              schema:
                type: object
                properties: {}
      deprecated: false
      tags:
      - Marketplace
    servers:
    - url: https://api.iugu.com/v1
  /marketplace:
    get:
      summary: Listar contas
      description: Lista as contas de um marketplace ou parceiro de negócios.
      operationId: listar-as-subcontas
      parameters:
      - name: limit
        in: query
        description: Limita em até 1.000 o número de registros listados. Caso não seja enviado, aplica-se o limite padrão de 100 registros
        schema:
          type: integer
          format: int32
      - name: start
        in: query
        description: Quantos registros pular do início da pesquisa
        schema:
          type: integer
          format: int32
      - name: query
        in: query
        description: Neste parâmetro pode ser passado um texto para pesquisa
        schema:
          type: string
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n  \"items\": [\n    {\n      \"id\": \"AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA\",\n      \"name\": \"Account #11111111-1111-1111-1111-111111111111\",\n      \"verified\": false\n    },\n    {\n      \"id\": \"BBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBB\",\n      \"name\": \"Test Account\",\n      \"verified\": false\n    },\n    {\n      \"id\": \"CCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCC\",\n      \"name\": \"Example Subaccount\",\n      \"verified\": false\n    },\n    {\n      \"id\": \"DDDDDDDDDDDDDDDDDDDDDDDDDDDDDDDD\",\n      \"name\": \"Verified Subaccount\",\n      \"verified\": true\n    },\n    {\n      \"id\": \"EEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEE\",\n      \"name\": \"Sample Account\",\n      \"verified\": false\n    },\n    {\n      \"id\": \"FFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFF\",\n      \"name\": \"Main Account\",\n      \"verified\": true\n    },\n    {\n      \"id\": \"GGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGG\",\n      \"name\": \"Test User\",\n      \"verified\": false\n    },\n    {\n      \"id\": \"HHHHHHHHHHHHHHHHHHHHHHHHHHHHHHHH\",\n      \"name\": \"Account #22222222-2222-2222-2222-222222222222\",\n      \"verified\": false\n    },\n    {\n      \"id\": \"IIIIIIIIIIIIIIIIIIIIIIIIIIIIIIII\",\n      \"name\": \"Account #33333333-3333-3333-3333-333333333333\",\n      \"verified\": false\n    },\n    {\n      \"id\": \"JJJJJJJJJJJJJJJJJJJJJJJJJJJJJJJJ\",\n      \"name\": \"Account #44444444-4444-4444-4444-444444444444\",\n      \"verified\": false\n    },\n    {\n      \"id\": \"KKKKKKKKKKKKKKKKKKKKKKKKKKKKKKKK\",\n      \"name\": \"Placeholder Name\",\n      \"verified\": false\n    },\n    {\n      \"id\": \"LLLLLLLLLLLLLLLLLLLLLLLLLLLLLLLL\",\n      \"name\": \"Example\",\n      \"verified\": false\n    },\n    {\n      \"id\": \"MMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMM\",\n      \"name\": \"Sample Data\",\n      \"verified\": false\n    },\n    {\n      \"id\": \"NNNNNNNNNNNNNNNNNNNNNNNNNNNNNNNN\",\n      \"name\": \"Account #Kart\",\n      \"verified\": false\n    },\n    {\n      \"id\": \"OOOOOOOOOOOOOOOOOOOOOOOOOOOOOOOO\",\n      \"name\": \"Sample Kart Account\",\n      \"verified\": false\n    },\n    {\n      \"id\": \"PPPPPPPPPPPPPPPPPPPPPPPPPPPPPPPP\",\n      \"name\": \"John Doe\",\n      \"verified\": false\n    },\n    {\n      \"id\": \"QQQQQQQQQQQQQQQQQQQQQQQQQQQQQQQQ\",\n      \"name\": \"Kartinho Account\",\n      \"verified\": false\n    },\n    {\n      \"id\": \"RRRRRRRRRRRRRRRRRRRRRRRRRRRRRRRR\",\n      \"name\": \"Test Subaccount\",\n      \"verified\": false\n    },\n    {\n      \"id\": \"SSSSSSSSSSSSSSSSSSSSSSSSSSSSSSSS\",\n      \"name\": \"API Token Test\",\n      \"verified\": false\n    },\n    {\n      \"id\": \"TTTTTTTTTTTTTTTTTTTTTTTTTTTTTTTT\",\n      \"name\": \"Unverified Account 2\",\n      \"verified\": false\n    },\n    {\n      \"id\": \"UUUUUUUUUUUUUUUUUUUUUUUUUUUUUUUU\",\n      \"name\": \"Verified API Account\",\n      \"verified\": true\n    },\n    {\n      \"id\": \"VVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVV\",\n      \"name\": \"API Created Account\",\n      \"verified\": true\n    },\n    {\n      \"id\": \"WWWWWWWWWWWWWWWWWWWWWWWWWWWWWWWW\",\n      \"name\": \"Sample Subaccount Name\",\n      \"verified\": false\n    },\n    {\n      \"id\": \"XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX\",\n      \"name\": \"Test Subaccount\",\n      \"verified\": true\n    },\n    {\n      \"id\": \"YYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYY\",\n      \"name\": \"Subaccount Placeholder\",\n      \"verified\": false\n    },\n    {\n      \"id\": \"ZZZZZZZZZZZZZZZZZZZZZZZZZZZZZZZZ\",\n      \"name\": \"Example Placeholder\",\n      \"verified\": false\n    },\n    {\n      \"id\": \"AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA\",\n      \"name\": \"Sub Account Test\",\n      \"verified\": false\n    },\n    {\n      \"id\": \"BBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBB\",\n      \"name\": \"Verified Kartinho\",\n      \"verified\": true\n    },\n    {\n      \"id\": \"CCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCC\",\n      \"name\": \"Verified User Account\",\n      \"verified\": true\n    }\n  ],\n  \"totalItems\": 29\n}"
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          example: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
                        name:
                          type: string
                          example: 'Account #11111111-1111-1111-1111-111111111111'
                        verified:
                          type: boolean
                          example: false
                          default: true
                  totalItems:
                    type: integer
                    example: 29
                    default: 0
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value: '{}'
              schema:
                type: object
                properties: {}
      deprecated: false
      tags:
      - Marketplace
    servers:
    - url: https://api.iugu.com/v1
